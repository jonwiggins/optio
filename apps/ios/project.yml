# XcodeGen spec. Regenerate the .xcodeproj with `xcodegen generate` (see README.md).
name: Optio
options:
  bundleIdPrefix: dev.optio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.25.0"
    CURRENT_PROJECT_VERSION: "11"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3H2754M9U5
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # Pinned: 1.99.0 (2026-10-08) dropped `TerminalView.getTerminal()`, which
    # TerminalTheme and LocalTerminalStream call; a fresh resolve of `from: 1.2.0`
    # no longer compiles. Lift the pin when those call sites move to the new API.
    exactVersion: "1.20.0"
targets:
  Optio:
    type: application
    platform: iOS
    sources:
      - path: Optio
        excludes:
          - "**/*.md"
      - path: Shared
    dependencies:
      - package: SwiftTerm
      - target: OptioWidgets
        embed: true
        codeSign: true
    entitlements:
      path: Optio/Optio.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.optio.ios]
        keychain-access-groups: ["$(AppIdentifierPrefix)dev.optio.ios.shared"]
        # Xcode promotes this to production when exporting for App Store Connect.
        aps-environment: development
    info:
      path: Optio/Resources/Info.plist
      properties:
        CFBundleDisplayName: Optio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        OptioSharedKeychainAccessGroup: "$(AppIdentifierPrefix)dev.optio.ios.shared"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        UISupportedInterfaceOrientations~ipad:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationPortraitUpsideDown,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        ITSAppUsesNonExemptEncryption: false
        # Servers are user-selected and may use HTTP on a LAN or tailnet.
        # NSAllowsLocalNetworking must not accompany this: it overrides the
        # arbitrary-load exception and blocks HTTP to fully qualified hosts.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Optio connects to your server to show your agents and let you manage their work.
        NSFaceIDUsageDescription: Unlock the stored Optio access token.
        NSSupportsLiveActivities: true
        # Two Optio windows side by side (iPad, and iPhone Duo's inner display —
        # Apple: "apps supporting multiple scenes on iPad automatically support
        # them on iPhone Duo"). SwiftUI WindowGroup does the rest.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [dev.optio.ios.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: dev.optio.auth
            CFBundleURLSchemes: [optio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.optio.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Midnight AppIcon-Terminal AppIcon-Blueprint AppIcon-Sticker AppIcon-Retro AppIcon-Sunrise AppIcon-Chip AppIcon-Blade"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  OptioWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: OptioWidgets
      - path: Shared
    info:
      path: OptioWidgets/Info.plist
      properties:
        CFBundleDisplayName: Optio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        OptioSharedKeychainAccessGroup: "$(AppIdentifierPrefix)dev.optio.ios.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: OptioWidgets/OptioWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.optio.ios]
        keychain-access-groups: ["$(AppIdentifierPrefix)dev.optio.ios.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.optio.ios.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground

  OptioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OptioTests]
    dependencies:
      - target: Optio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.optio.ios.tests
  # Hostless: renders the widget extension's views (Sessions widget families, Live
  # Activity lock screen + island regions) into contact-sheet PNGs with ImageRenderer
  # when TEST_RUNNER_OPTIO_WIDGET_SHOT_DIR is set; otherwise it just checks they
  # render. Not hosted by the app on purpose — a hosted runner hung before connecting.
  #   xcodebuild test -scheme WidgetSnapshots -destination 'platform=iOS Simulator,name=iPhone 17e' \
  #     TEST_RUNNER_OPTIO_WIDGET_SHOT_DIR=/tmp/shots
  WidgetSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WidgetSnapshots
      - path: Shared
      - path: OptioWidgets
        excludes:
          - OptioWidgetsBundle.swift
          - Info.plist
          - "Resources/**"
          - "*.entitlements"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.optio.ios.widget-snapshots
  OptioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OptioUITests]
    dependencies:
      - target: Optio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.optio.ios.uitests
        TEST_TARGET_NAME: Optio
schemes:
  WidgetSnapshots:
    build:
      targets:
        WidgetSnapshots: [test]
    test:
      config: Debug
      targets: [WidgetSnapshots]
  Optio:
    build:
      targets:
        Optio: all
        OptioWidgets: all
        OptioTests: [test]
        OptioUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [OptioTests, OptioUITests]
