# XcodeGen spec. Regenerate the .xcodeproj with `xcodegen generate` (see README.md).
name: Optio
options:
  bundleIdPrefix: dev.optio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3H2754M9U5
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
targets:
  Optio:
    type: application
    platform: iOS
    sources:
      - path: Optio
        excludes:
          - "**/*.md"
      - path: Shared
    dependencies:
      - package: SwiftTerm
      - target: OptioWidgets
        embed: true
        codeSign: true
    entitlements:
      path: Optio/Optio.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.optio.ios]
        keychain-access-groups: ["$(AppIdentifierPrefix)dev.optio.ios.shared"]
        # aps-environment is added automatically by Xcode once the Push
        # Notifications capability is enabled on a paid team.
    info:
      path: Optio/Resources/Info.plist
      properties:
        CFBundleDisplayName: Optio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        UISupportedInterfaceOrientations~ipad:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationPortraitUpsideDown,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        ITSAppUsesNonExemptEncryption: false
        # Optio instances on a tailnet are commonly reached over plain HTTP
        # (http://host.tailnet.ts.net:30400). Tighten this to an
        # NSExceptionDomains entry once you front the API with Tailscale Serve TLS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: Unlock the stored Optio access token.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [dev.optio.ios.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: dev.optio.auth
            CFBundleURLSchemes: [optio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.optio.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Midnight AppIcon-Terminal AppIcon-Blueprint AppIcon-Sticker AppIcon-Retro AppIcon-Sunrise AppIcon-Chip"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  OptioWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: OptioWidgets
      - path: Shared
    info:
      path: OptioWidgets/Info.plist
      properties:
        CFBundleDisplayName: Optio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: OptioWidgets/OptioWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.optio.ios]
        keychain-access-groups: ["$(AppIdentifierPrefix)dev.optio.ios.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.optio.ios.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground

  OptioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OptioTests]
    dependencies:
      - target: Optio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.optio.ios.tests
  OptioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OptioUITests]
    dependencies:
      - target: Optio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.optio.ios.uitests
        TEST_TARGET_NAME: Optio
schemes:
  Optio:
    build:
      targets:
        Optio: all
        OptioWidgets: all
        OptioTests: [test]
        OptioUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [OptioTests, OptioUITests]
