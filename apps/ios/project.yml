# XcodeGen spec. Regenerate the .xcodeproj with `xcodegen generate` (see README.md).
name: Optio
options:
  bundleIdPrefix: dev.optio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
targets:
  Optio:
    type: application
    platform: iOS
    sources:
      - path: Optio
        excludes:
          - "**/*.md"
    dependencies:
      - package: SwiftTerm
    info:
      path: Optio/Resources/Info.plist
      properties:
        CFBundleDisplayName: Optio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        UISupportedInterfaceOrientations~ipad:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationPortraitUpsideDown,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        ITSAppUsesNonExemptEncryption: false
        # Optio instances on a tailnet are commonly reached over plain HTTP
        # (http://host.tailnet.ts.net:30400). Tighten this to an
        # NSExceptionDomains entry once you front the API with Tailscale Serve TLS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: Unlock the stored Optio access token.
        CFBundleURLTypes:
          - CFBundleURLName: dev.optio.auth
            CFBundleURLSchemes: [optio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.optio.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  OptioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OptioTests]
    dependencies:
      - target: Optio
schemes:
  Optio:
    build:
      targets:
        Optio: all
        OptioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [OptioTests]
