<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7738E8"/>
      <stop offset="1" stop-color="#421596"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8DEFF"/>
    </linearGradient>
    <mask id="top-blade">
      <rect x="152" y="214" width="720" height="254" rx="36" fill="white"/>
      <!-- Optio's two vertical eyes, cut into the upper blade. -->
      <rect x="258" y="290" width="40" height="102" rx="20" fill="black"/>
      <rect x="374" y="290" width="40" height="102" rx="20" fill="black"/>
      <!-- A diagonal split carries the corner cut from the Optio mark. -->
      <path d="M700 198L888 386" stroke="black" stroke-width="26"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect x="152" y="232" width="720" height="254" rx="36" fill="#230957" opacity=".2"/>
  <rect x="152" y="574" width="720" height="254" rx="36" fill="#230957" opacity=".2"/>
  <rect x="152" y="214" width="720" height="254" fill="url(#face)" mask="url(#top-blade)"/>
  <rect x="152" y="556" width="720" height="254" rx="36" fill="#C4ADF5"/>
  <circle cx="278" cy="683" r="30" fill="#4A2190"/>
  <circle cx="278" cy="683" r="13" fill="#DFFFEF"/>
  <g fill="#6A42A8">
    <rect x="402" y="638" width="350" height="26" rx="13"/>
    <rect x="402" y="702" width="350" height="26" rx="13"/>
  </g>
</svg>
