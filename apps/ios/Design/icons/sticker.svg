<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sticker: peeled off a laptop lid and slapped on slightly crooked. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- crisp offset shadow (the sticker lifting at the edge) -->
  <g transform="translate(512 512) rotate(-8) translate(-500 -496)">
    <g transform="translate(140 140) scale(31)" fill="none" stroke="#3b0764" stroke-opacity="0.35" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8V4H8"/>
      <rect width="16" height="12" x="4" y="8" rx="2.4"/>
      <path d="M2 14h2"/>
      <path d="M20 14h2"/>
    </g>
  </g>
  <g transform="translate(512 512) rotate(-8) translate(-512 -512)">
    <!-- thick white die-cut border -->
    <g transform="translate(140 140) scale(31)" fill="none" stroke="#ffffff" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8V4H8"/>
      <rect width="16" height="12" x="4" y="8" rx="2.4"/>
      <path d="M2 14h2"/>
      <path d="M20 14h2"/>
    </g>
    <!-- purple bot on top -->
    <g transform="translate(140 140) scale(31)" fill="none" stroke="#6d28d9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8V4H8"/>
      <rect width="16" height="12" x="4" y="8" rx="2.4" fill="#ffffff"/>
      <path d="M2 14h2"/>
      <path d="M20 14h2"/>
      <path d="M15 13v2"/>
      <path d="M9 13v2"/>
    </g>
  </g>
</svg>
