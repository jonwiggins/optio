# Default Robolectric config for every Android module's unit tests (build-logic adds this directory
# to each module's test resources).
#
# SDK 36, not 37: Espresso 3.7.0 (Compose UI tests idle through it) calls
# InputManager.getInstance(), which the API 37 android-all jar no longer has. Move to 37 once a
# stable Espresso/Robolectric pair supports it.
#
# Override for one test class with @Config(sdk = [...]), or for a package with a
# robolectric.properties in that package's resource directory (Robolectric merges them).
sdk=36
