# Optio Android build settings.
#
# Tuned for a shared machine where several agents build at once: a modest heap per Gradle
# daemon, a capped worker pool, and a 15-minute idle timeout so idle daemons free their memory.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=900000
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

kotlin.daemon.jvmargs=-Xmx2g
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
