# Optio Helm Chart Values
#
# Defaults are production-ready: GHCR images with IfNotPresent pull policy.
# For local development, use values.local.yaml:
#   helm install optio helm/optio -f helm/optio/values.local.yaml ...
# (setup-local.sh does this automatically)
#
# For production deployments, see values.production.yaml for recommended overrides
# (replicas, autoscaling, ingress, external DB/Redis, etc.).
#
# Install a released chart: helm install optio oci://ghcr.io/jonwiggins/optio

# ──────────────────────────────────────────────────────────────────────────────
# API Server
# ──────────────────────────────────────────────────────────────────────────────
api:
  image:
    repository: ghcr.io/jonwiggins/optio-api
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 4000
  service:
    type: ClusterIP    # Set to NodePort for local K8s dev (Docker Desktop, kind, minikube)
    nodePort: ""       # Fixed node port when type=NodePort, e.g. 4000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    LOG_LEVEL: info
  # Extra volumes and mounts for the API container, verbatim (a PVC or a sync
  # sidecar's volume for configAsCode, a CA bundle, …).
  extraVolumes: []
  extraVolumeMounts: []
  # Rollout strategy for the API Deployment ({} = Kubernetes' RollingUpdate).
  # Upgrades whose migrations move data between tables (see CHANGELOG) are
  # safest with `{ type: Recreate }`: no old replica keeps serving against
  # tables the new one just replaced.
  strategy:
    type: Recreate
  # Migrations run at boot, before the API listens: the startup probe allows
  # failureThreshold × 10s for them before liveness checks begin.
  startupProbe:
    failureThreshold: 60
  # Pod anti-affinity spreads API replicas across nodes.
  # "soft" = preferredDuringSchedulingIgnoredDuringExecution (default)
  # "hard" = requiredDuringSchedulingIgnoredDuringExecution
  # ""     = disabled
  antiAffinity: soft
  # Kubernetes nodeSelector for API pods (opt-in).
  nodeSelector: {}
  # Pod disruption budget. Enable when running multiple replicas to ensure
  # availability during voluntary disruptions (rolling updates, node drains).
  pdb:
    enabled: false
    # Set ONE of minAvailable or maxUnavailable (not both).
    minAvailable: ""         # e.g. 1 or "50%"
    maxUnavailable: 1        # Used when minAvailable is empty
  # Horizontal pod autoscaler. Requires metrics-server in the cluster.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ""  # Optional, e.g. 80
  # The Local relay and live session connections are process-local. Only one
  # API/web pod is supported. Recreate prevents overlap during an upgrade;
  # clients/daemons reconnect after the brief deployment interruption.

# ──────────────────────────────────────────────────────────────────────────────
# Web UI
# ──────────────────────────────────────────────────────────────────────────────
# Runs as a second container in the API pod, so it follows the API's
# replicas, autoscaling, PDB, anti-affinity and nodeSelector.
web:
  image:
    repository: ghcr.io/jonwiggins/optio-web
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  service:
    type: ClusterIP    # Set to NodePort for local K8s dev (Docker Desktop, kind, minikube)
    nodePort: ""       # Fixed node port when type=NodePort, e.g. 3100
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ──────────────────────────────────────────────────────────────────────────────
# Optio Operations Assistant Pod
# A single always-on pod running the Optio conversational assistant.
# It makes API calls on behalf of users — no repo checkout needed.
# ──────────────────────────────────────────────────────────────────────────────
optio:
  # Off by default: nothing in Optio needs it. Set true to run it.
  enabled: false
  image:
    repository: ghcr.io/jonwiggins/optio-optio
    tag: latest
    pullPolicy: IfNotPresent
  # Kubernetes nodeSelector for the optio assistant pod (opt-in).
  nodeSelector: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ──────────────────────────────────────────────────────────────────────────────
# Agent containers
# ──────────────────────────────────────────────────────────────────────────────
# References to pre-existing Kubernetes Secrets, keyed by environment variable.
# Values never enter the Helm release or chart-managed Secret. API container only.
# Example: DATABASE_URL: { name: optio-runtime, key: database-url }
# Required for managed services: DATABASE_URL, REDIS_URL, OPTIO_ENCRYPTION_KEY.
# OAuth uses GITHUB_OAUTH_CLIENT_ID/GITHUB_OAUTH_CLIENT_SECRET (or GOOGLE_,
# GITLAB_, OIDC_ISSUER_URL/OIDC_CLIENT_ID/OIDC_CLIENT_SECRET).
existingSecrets: {}

agent:
  # Separate identity from the API's Kubernetes administrator service account.
  # Attach an EKS Pod Identity/IRSA role here only when agents need AWS access.
  serviceAccount:
    create: true
    name: "" # defaults to <release>-agent
    annotations: {}
  image:
    repository: ghcr.io/jonwiggins/optio-agent-base
    tag: latest
    pullPolicy: IfNotPresent
    # Prefix used to resolve preset images (base, node, python, go, rust, full, dind).
    # The full image name is: {prefix}{preset}:{tag}
    # GHCR: ghcr.io/jonwiggins/optio-agent-  →  ghcr.io/jonwiggins/optio-agent-node:latest
    # Local: optio-                           →  optio-node:latest
    prefix: "ghcr.io/jonwiggins/optio-agent-"
  imagePullPolicy: IfNotPresent
  # Envoy sidecar proxy for secret isolation.
  # When repos.secretProxy is enabled, this image is added as a sidecar to agent pods.
  # The sidecar intercepts outbound HTTPS requests and injects auth headers so the
  # agent container never sees raw secrets (GitHub token, Anthropic API key).
  envoyProxy:
    image:
      repository: envoyproxy/envoy
      tag: v1.31-latest
      pullPolicy: IfNotPresent
  # PVC template for repo pod home directories.
  # These PVCs are created dynamically by the API server (one per repo pod
  # instance), but this template controls the storage class and default size.
  pvc:
    storageClass: ""  # Empty = cluster default storage class
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  # Kubernetes scheduling constraints for agent pods.
  # nodeSelector pins pods to nodes with matching labels (e.g. a dedicated node pool).
  # tolerations allow pods to schedule on tainted nodes.
  nodeSelector: {}
  #  cloud.google.com/gke-nodepool: agents
  tolerations: []
  #  - key: optio.dev/agents
  #    operator: Equal
  #    value: "true"
  #    effect: NoSchedule
  # StatefulSet/Job configuration for agent pods.
  # When enabled, repo pods are managed by StatefulSets and workflow pods by
  # Jobs. This enables Karpenter (and other node autoscalers) to provision
  # nodes for agent workloads. Set to false for bare-pod mode (legacy).
  statefulSet:
    enabled: true
    terminationGracePeriodSeconds: 300
  # Rootless mode for clusters that forbid root containers (restricted
  # PodSecurity, OpenShift, rootless runtimes). Skips the root-running
  # home-perm-fix initContainer on agent StatefulSets and relies on
  # fsGroup + fsGroupChangePolicy=OnRootMismatch for PVC ownership, and
  # stamps runAsNonRoot on agent pods. Requires a CSI driver that honors
  # fsGroup (most cloud CSI drivers do; hostpath-style ones often don't).
  rootless: false
  # Shared cache directory PVCs (opt-in per repo).
  # Controls storage class and size limits for cache directories.
  cache:
    enabled: true                     # Set false to hard-disable the feature
    storageClass: ""                  # Empty = cluster default storage class
    maxSizePerDirectoryGi: 100        # Max size for a single cache directory
    maxSizeTotalGi: 200               # Max total cache size across all dirs per repo
    defaultSizePerDirectoryGi: 10     # Default size when creating a cache directory
  # Repo init timeout (how long to wait for clone to complete)
  repoInitTimeoutMs: 120000           # 2 min default; increase for large repos

# Per-IP API rate limit (requests per minute). The web UI proxies through the
# Next server, but the iOS app and CLI talk to the API directly and poll several
# endpoints, so keep this comfortably above their steady-state traffic.
rateLimit:
  maxPerMinute: 600

# Outbound URL guard (SSRF). URLs people type that the API itself fetches —
# outbound webhooks, Slack notifications, ticket providers, connection health
# checks — may never point at loopback, link-local (cloud metadata), multicast
# or reserved addresses, and not at private ranges unless allowed here. An
# in-cluster API is a common, legitimate target: allow every private range, or
# list the hosts (names, "*.suffix" names, IPs or CIDRs; a listed host is
# allowed whatever it resolves to, loopback included).
outbound:
  allowPrivate: false
  allowedHosts: []   # e.g. ["*.svc.cluster.local", "vault.internal", "10.1.0.0/16"]

# ──────────────────────────────────────────────────────────────────────────────
# Network Policy
# Default-deny policy for agent (repo) pods. Restricts cluster-internal
# traffic so compromised pods cannot reach PostgreSQL, Redis, or other
# services directly. Requires a CNI plugin that supports NetworkPolicy
# (e.g. Calico, Cilium, Weave Net). Not supported on Docker Desktop.
# ──────────────────────────────────────────────────────────────────────────────
networkPolicy:
  enabled: false  # Set to true when your cluster supports NetworkPolicy

# ──────────────────────────────────────────────────────────────────────────────
# Installed-skills cache (Phase 2 of issue #497)
#
# When enabled, the API deployment mounts a PVC at /opt/optio/skills-cache.
# The skill-sync worker writes content-addressable git clones there (keyed by
# resolved commit SHA) so multiple installed-skill rows pinned to the same
# SHA share a single copy and survive API rollouts.
#
# When disabled, /opt/optio/skills-cache falls back to an emptyDir, meaning
# every API restart re-clones every installed skill from upstream. Fine for
# dev; turn this on in production.
# ──────────────────────────────────────────────────────────────────────────────
installedSkillsCache:
  enabled: false
  storageClass: ""  # Empty = cluster default storage class
  size: 5Gi
  accessModes:
    - ReadWriteOnce

# ──────────────────────────────────────────────────────────────────────────────
# Config as code (docs/config-as-code.md)
#
# A directory of YAML manifests — Jobs, scheduled Tasks, agents, prompts,
# repos, MCP servers, skills, connections — that the API reads every
# `interval` and applies to one workspace. The files are the truth: a manifest
# that changes is applied, one that disappears is pruned (unless prune=false),
# and a managed resource edited in the UI is put back at the next sync.
#
# Feed the directory one of three ways:
#   files:     inline manifests, rendered into a ConfigMap by this chart
#   configMap: the name of a ConfigMap you maintain (each key is a file)
#   api.extraVolumes / api.extraVolumeMounts: anything else (a PVC, a sync
#              sidecar's volume) mounted at `mountPath`
# ──────────────────────────────────────────────────────────────────────────────
configAsCode:
  enabled: false
  # Where the directory is mounted in the API container (OPTIO_CONFIG_DIR).
  mountPath: /etc/optio-config
  # The workspace the manifests belong to, by slug. Empty = the oldest
  # workspace (the organization's, as the sign-in bootstrap makes it).
  workspace: ""
  # Delete resources whose manifest is gone (OPTIO_CONFIG_PRUNE).
  prune: true
  # How often the directory is read, in milliseconds (OPTIO_CONFIG_INTERVAL).
  intervalMs: 60000
  # An existing ConfigMap to mount as the directory (one key per file, e.g.
  # "work-nightly.yaml"). Takes precedence over `files`.
  configMap: ""
  # Inline manifests, one key per file name; rendered into a ConfigMap.
  # files:
  #   nightly-bump.yaml: |
  #     apiVersion: optio/v1
  #     kind: Work
  #     metadata: { name: nightly-dependency-bump }
  #     spec: { ... }
  files: {}

# ──────────────────────────────────────────────────────────────────────────────
# PostgreSQL (built-in)
# Set enabled=false and configure externalDatabase.url for managed Postgres.
# ──────────────────────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Kubernetes nodeSelector for PostgreSQL pods (opt-in).
  nodeSelector: {}
  storage:
    storageClass: ""  # Empty = cluster default storage class
    size: 5Gi
  auth:
    database: optio
    username: optio
    # REQUIRED when auth is enabled. Override this in production.
    password: ""
  # TLS encryption for the in-cluster Postgres connection.
  # When enabled, a self-signed CA + server cert are generated at install time
  # and the DATABASE_URL is configured with sslmode=verify-full.
  tls:
    enabled: true

# ──────────────────────────────────────────────────────────────────────────────
# Redis (built-in)
# Set enabled=false and configure externalRedis.url for managed Redis.
# ──────────────────────────────────────────────────────────────────────────────
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  # Kubernetes nodeSelector for Redis pods (opt-in).
  nodeSelector: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # TLS encryption for in-cluster Redis. Encrypts data in transit (BullMQ job
  # payloads, pub/sub log streams) with TLSv1.3. Recommended for production.
  tls:
    enabled: true
    # When true, generates a self-signed CA + server cert at install time via
    # Helm's genSignedCert. Set to false if providing certs externally
    # (e.g., cert-manager) and populate redis.tls.existingSecret.
    autoGenerateCert: true
    # Name of an existing TLS Secret (type kubernetes.io/tls with ca.crt key).
    # Only used when autoGenerateCert is false.
    existingSecret: ""
  # Redis password authentication (requirepass). Strongly recommended alongside TLS.
  auth:
    enabled: true
    # Leave empty to auto-generate a 32-char password at install time.
    # The password is stored in a K8s Secret and persisted across upgrades.
    password: ""

# ──────────────────────────────────────────────────────────────────────────────
# External services (used when built-in PostgreSQL/Redis are disabled)
# ──────────────────────────────────────────────────────────────────────────────

# REQUIRED when postgresql.enabled=false
externalDatabase:
  url: ""  # e.g., postgres://user:pass@host:5432/optio

# REQUIRED when redis.enabled=false
externalRedis:
  # Standalone: one URL. Cluster: a comma-separated list of seed nodes — one
  # entry for ElastiCache Serverless, which always runs in cluster mode.
  url: ""  # e.g., rediss://:password@host:6379 (use rediss:// for TLS)
  # "standalone" (default) or "cluster" (Redis Cluster / ElastiCache
  # Serverless). In cluster mode every client is cluster-aware and every
  # BullMQ queue lives under a hash-tagged key prefix (see docs/redis.md).
  mode: standalone
  # BullMQ key prefix. Empty = "bull" standalone, "{optio}" in cluster mode
  # (cluster mode requires a {hash-tag}). Set to share one Redis Cluster
  # between Optio installs, e.g. "{optio-staging}".
  queuePrefix: ""

# ──────────────────────────────────────────────────────────────────────────────
# Public URL
# REQUIRED when auth is enabled. The externally-reachable URL where both web
# and API are served (same origin via ingress path routing).
# Used for OAuth callbacks, Slack links, etc.
# ──────────────────────────────────────────────────────────────────────────────
publicUrl: ""  # e.g. https://optio.example.com

# ──────────────────────────────────────────────────────────────────────────────
# Authentication
# When auth.disabled=false (the default), publicUrl is REQUIRED. An OAuth
# provider is optional here: with none configured, the setup wizard's Sign-in
# step configures the organization's Google sign-in from the browser, unlocked
# by the setup token (auth.setupToken, or the one the API prints in its log).
# ──────────────────────────────────────────────────────────────────────────────
auth:
  # Set to true to disable authentication (NOT recommended for production).
  disabled: false
  # One-time token that unlocks the setup wizard's Sign-in step while nobody
  # can sign in yet (and lets a signed-in person claim the deployment-admin
  # role on a deployment that has none). Leave empty to have the API generate
  # one and print it: kubectl logs deploy/optio-api -n optio | grep "setup token"
  setupToken: ""
  # Emails that are deployment admins (may change how everyone signs in),
  # besides the ones made so in the app. e.g. ["ops@example.com"]
  deploymentAdmins: []
  # OAuth provider credentials — optional (see above).
  github:
    clientId: ""
    clientSecret: ""
  google:
    clientId: ""
    clientSecret: ""
  gitlab:
    clientId: ""
    clientSecret: ""
    # baseUrl: https://gitlab.com  # Self-hosted GitLab URL
  # Generic OIDC provider (Keycloak, Authentik, Authelia, Zitadel, Okta, Auth0, etc.)
  oidc:
    issuerUrl: ""       # e.g. https://auth.example.com/realms/optio
    clientId: ""
    clientSecret: ""
    displayName: "SSO"  # Button label: "Sign in with {displayName}"
    scopes: ""          # Defaults to "openid email profile" if empty

# ──────────────────────────────────────────────────────────────────────────────
# GitHub webhook signature validation
# ──────────────────────────────────────────────────────────────────────────────
webhook:
  # The receivers (/api/webhooks/github, /api/webhooks/slack/events,
  # /api/webhooks/slack/actions, /api/webhooks/linear, /api/webhooks/pagerduty,
  # /api/webhooks/gitlab, /api/webhooks/jira, /api/webhooks/sentry) take no
  # Optio session; each rejects every delivery until its secret below is set.
  # (Pylon, Alertmanager / Grafana and Datadog deliveries go to
  # /api/hooks/<type>/<trigger id> and carry the trigger's own shared secret —
  # nothing to set here.)
  githubSecret: ""  # Generate with: openssl rand -hex 32. Must match GitHub's webhook config.
  # Slack event triggers and the retry/cancel buttons on Slack notifications,
  # plus Linear and PagerDuty event triggers.
  slackSigningSecret: ""  # Slack app → Basic Information → Signing Secret
  linearSecret: ""  # Linear → Settings → API → Webhooks → signing secret
  pagerdutySecret: ""  # PagerDuty → Integrations → Generic Webhooks (v3) → the subscription's signing secret
  gitlabSecret: ""  # GitLab → project / group → Settings → Webhooks → Secret token (sent as X-Gitlab-Token)
  jiraSecret: ""  # Jira → Settings → System → WebHooks → the webhook's secret (X-Hub-Signature)
  sentrySecret: ""  # Sentry → Developer Settings → the internal integration's Client Secret (Sentry-Hook-Signature)

# ──────────────────────────────────────────────────────────────────────────────
# GitHub App (recommended — replaces OAuth App + PAT for GitHub operations)
# Register at https://github.com/organizations/{org}/settings/apps
# Required permissions: Contents R/W, Pull Requests R/W, Issues R/W, Checks R, Metadata R
# ──────────────────────────────────────────────────────────────────────────────
github:
  app:
    # IMPORTANT: id and installationId MUST be quoted strings in your values file.
    # Unquoted large integers are silently truncated by YAML float parsing.
    # Correct:   id: "123456"
    # Wrong:     id: 123456
    id: ""                # App ID (quoted string)
    clientId: ""          # Client ID (for user OAuth login flow)
    clientSecret: ""      # Client secret (for user OAuth login flow)
    installationId: ""    # Installation ID (quoted string)
    privateKey: ""        # PEM private key (for server-side installation tokens)
    # Git commit author for agent commits. Use the GitHub App's bot identity
    # so commits show properly in the GitHub UI.
    # Format: "{app-name}[bot]" and "{app-id}+{app-slug}[bot]@users.noreply.github.com"
    # Find these on your app's settings page at github.com/settings/apps/{slug}
    botName: ""           # e.g. "my-optio-app[bot]"
    botEmail: ""          # e.g. "123456+my-optio-app[bot]@users.noreply.github.com"
    # Use an existing K8s Secret instead of the values above. The secret must
    # contain keys: GITHUB_APP_ID, GITHUB_APP_CLIENT_ID, GITHUB_APP_CLIENT_SECRET,
    # GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY.
    # Optionally also: GITHUB_APP_BOT_NAME, GITHUB_APP_BOT_EMAIL.
    # Useful with external-secrets-operator, sealed-secrets, or vault-injector.
    existingSecret: ""

# ──────────────────────────────────────────────────────────────────────────────
# Secrets encryption
# REQUIRED. Generate with: openssl rand -hex 32
# ──────────────────────────────────────────────────────────────────────────────
encryption:
  key: ""

# Shared secret for pod-to-API credential requests (git credential helper).
# If empty, derived from the encryption key at startup.
credentialSecret: ""

# ──────────────────────────────────────────────────────────────────────────────
# Ingress
# ──────────────────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  # The ingress template automatically blocks /api/internal/* from public traffic
  # via an nginx server-snippet. These endpoints use bearer token auth (not session
  # auth) and must only be reachable within the cluster. If using a non-nginx ingress
  # controller, add equivalent path-blocking rules in the annotations below.
  annotations: {}
  # cert-manager TLS support. When enabled, the chart adds the
  # cert-manager.io/cluster-issuer annotation and generates a TLS block
  # for each host automatically.
  certManager:
    enabled: false
    clusterIssuer: letsencrypt-prod
  hosts:
    - host: optio.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
        - path: /ws
          pathType: Prefix
          service: api
  # Manual TLS configuration. When certManager is enabled, TLS entries are
  # generated automatically from hosts — this field is only needed for
  # manual certificate management.
  tls: []
  #  - secretName: optio-tls
  #    hosts:
  #      - optio.example.com

# ──────────────────────────────────────────────────────────────────────────────
# Gateway API
# Alternative to Ingress for clusters running Gateway API (GA in K8s 1.26+).
# Mutually exclusive with ingress — do not enable both.
# ──────────────────────────────────────────────────────────────────────────────
gatewayAPI:
  enabled: false
  # Gateway controller class (required when enabled).
  # Common values: cilium, istio, envoy-gateway
  gatewayClassName: ""
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    # - name: https
    #   port: 443
    #   protocol: HTTPS
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - name: optio-tls
  # Hostname for the Gateway and HTTPRoute. Leave empty for wildcard.
  hostname: ""
  # Annotations for the Gateway resource (e.g., cert-manager).
  gatewayAnnotations: {}
  # Annotations for the HTTPRoute resource (e.g., rate-limiting).
  httpRouteAnnotations: {}

# ──────────────────────────────────────────────────────────────────────────────
# Push Notifications (Web Push API)
# Optional. If publicKey/privateKey are empty, browser push is disabled.
# Generate keys with: npx web-push generate-vapid-keys --json
# ──────────────────────────────────────────────────────────────────────────────
notifications:
  vapid:
    publicKey: ""
    privateKey: ""
    subject: ""  # e.g. mailto:ops@example.com
  # ── iOS push (APNs, token-based auth) — see docs/ios-push.md ──
  # Leave keyId empty to disable. Create a key under Certificates, Identifiers &
  # Profiles → Keys with the "Apple Push Notifications service (APNs)" capability.
  apns:
    keyId: ""          # 10-char key id from the developer portal
    teamId: ""         # 10-char Apple Developer team id
    key: ""            # PEM contents of the AuthKey_<keyId>.p8 file (multi-line ok)
    bundleId: "dev.optio.ios"
    environment: "sandbox"   # sandbox (Xcode builds) | production (TestFlight / App Store)
    # Name of a pre-created Secret carrying OPTIO_APNS_KEY_ID, OPTIO_APNS_TEAM_ID,
    # OPTIO_APNS_KEY (and optionally OPTIO_APNS_BUNDLE_ID / OPTIO_APNS_ENVIRONMENT)
    # for clusters that keep the key out of values. When set, keyId/teamId/key above are ignored.
    existingSecret: ""
  # ── Android push (Firebase Cloud Messaging, HTTP v1) — see docs/android-push.md ──
  # Leave serviceAccount empty to disable. Firebase console → Project settings →
  # Service accounts → Generate new private key; paste the downloaded JSON
  # (or `--set-file notifications.fcm.serviceAccount=sa.json`).
  fcm:
    serviceAccount: ""   # the service-account key JSON (multi-line ok)
    projectId: ""        # optional; defaults to the key's project_id
    # Name of a pre-created Secret carrying OPTIO_FCM_SERVICE_ACCOUNT (and optionally
    # OPTIO_FCM_PROJECT_ID) for clusters that keep the key out of values. When set,
    # serviceAccount / projectId above are ignored.
    existingSecret: ""

# ──────────────────────────────────────────────────────────────────────────────
# Observability (OpenTelemetry)
# Set otel.enabled=true and configure OTEL_EXPORTER_OTLP_ENDPOINT to ship
# traces, metrics, and (optionally) logs to any OTLP backend (Datadog,
# Honeycomb, Grafana Cloud, etc.).
# ──────────────────────────────────────────────────────────────────────────────
observability:
  otel:
    enabled: false
    endpoint: ""             # e.g. https://api.honeycomb.io:443 or http://otel-collector:4318
    protocol: "http/protobuf"
    headers: ""              # Comma-separated key=value, e.g. "x-honeycomb-team=abc123"
    serviceName: "optio-api"
    resourceAttributes: ""   # Extra attrs, e.g. "team=platform,region=us-east-1"
    samplingRatio: "1.0"
    metricsIntervalMs: "60000"
    logsEnabled: false
    debug: false

# ──────────────────────────────────────────────────────────────────────────────
# Namespace
# ──────────────────────────────────────────────────────────────────────────────
namespace: optio

# ──────────────────────────────────────────────────────────────────────────────
# Namespace resource quotas
# Enable to prevent rogue agents from consuming all cluster resources.
# ──────────────────────────────────────────────────────────────────────────────
resourceQuota:
  enabled: false
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    pods: "50"
    persistentvolumeclaims: "30"

# ──────────────────────────────────────────────────────────────────────────────
# RBAC
# ──────────────────────────────────────────────────────────────────────────────
rbac:
  clusterRole:
    # Set to false for namespace-only deployments where cluster-wide
    # permissions are not available (e.g. shared multitenant clusters).
    # When disabled, the cluster overview page will not show node
    # utilization, but all other functionality works normally.
    create: true

# ──────────────────────────────────────────────────────────────────────────────
# Service account
# ──────────────────────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: optio
  # Annotations for the service account (e.g., for GKE Workload Identity or EKS IRSA).
  # Used by both API/web pods (for K8s API access) and agent pods (for cloud service auth).
  # Example for GKE Workload Identity:
  #   iam.gke.io/gcp-service-account: optio@PROJECT_ID.iam.gserviceaccount.com
  # Example for EKS IRSA (lets CodeCommit use the pod's IAM role instead of static AWS keys):
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/optio-codecommit
  annotations: {}

# ──────────────────────────────────────────────────────────────────────────────
# Image pull secrets for pulling from private registries.
# Each entry should be the name of an existing Kubernetes secret of type
# kubernetes.io/dockerconfigjson in the target namespace.
# ──────────────────────────────────────────────────────────────────────────────
imagePullSecrets: []
#  - name: my-registry-secret
