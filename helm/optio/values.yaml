# Optio Helm Chart Values
#
# Defaults are production-ready: GHCR images with IfNotPresent pull policy.
# For local development, use values.local.yaml:
#   helm install optio helm/optio -f helm/optio/values.local.yaml ...
# (setup-local.sh does this automatically)
#
# For production deployments, see values.production.yaml for recommended overrides
# (replicas, autoscaling, ingress, external DB/Redis, etc.).
#
# Install a released chart: helm install optio oci://ghcr.io/jonwiggins/optio

# ──────────────────────────────────────────────────────────────────────────────
# Feature lists (docs/feature-lists.md). Empty lists offer every supported option.
# Narrow each independently; model access and built-in policy rules are separate.
features:
  runtimes: []
  gitPlatforms: []
  triggers: []
  ticketSources: []
  connectionProviders: []
modelAccess: any
agentPolicy:
  builtInRules: false

# ──────────────────────────────────────────────────────────────────────────────
# API Server
# ──────────────────────────────────────────────────────────────────────────────
api:
  image:
    repository: ghcr.io/jonwiggins/optio-api
    tag: latest
    pullPolicy: IfNotPresent
  # API/web pods. Any number share the database and Redis
  # (docs/plans/scale-out.md): runs, sweeps, session chat and the Optio Local
  # relay coordinate through Postgres leases and Redis pub/sub. Per pod are
  # only caches and the WebSocket cap (see below).
  replicas: 1
  port: 4000
  service:
    type: ClusterIP    # Set to NodePort for local K8s dev (Docker Desktop, kind, minikube)
    nodePort: ""       # Fixed node port when type=NodePort, e.g. 4000
  # One API serves the whole organization: raise the limits (e.g. 2 CPU,
  # 1536Mi) when several people's first page loads meet and it is throttled.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    LOG_LEVEL: info
  # Extra volumes and mounts for the API container, verbatim (a PVC or a sync
  # sidecar's volume for configAsCode, a CA bundle, …).
  extraVolumes: []
  extraVolumeMounts: []
  # Extra environment variables for the API container, verbatim. To trust an
  # internal CA, mount its bundle with extraVolumes and point Node at it:
  #   - name: NODE_EXTRA_CA_CERTS
  #     value: /etc/optio-ca/ca.crt
  extraEnv: []
  # The API Deployment always rolls out with Recreate: migrations run at
  # boot, so no old pod may keep serving against tables the new one just
  # changed. Runs, Local daemons and viewers reconnect after the seconds-long
  # gap. (Kept for reference; the template does not read it.)
  strategy:
    type: Recreate
  # Migrations run at boot, before the API listens: the startup probe allows
  # failureThreshold × 10s for them before liveness checks begin.
  startupProbe:
    failureThreshold: 60
  # Pod anti-affinity spreads API replicas across nodes.
  # "soft" = preferredDuringSchedulingIgnoredDuringExecution (default)
  # "hard" = requiredDuringSchedulingIgnoredDuringExecution
  # ""     = disabled
  antiAffinity: soft
  # Kubernetes nodeSelector for API pods (opt-in).
  nodeSelector: {}
  # Pod disruption budget. Enable when running multiple replicas to ensure
  # availability during voluntary disruptions (rolling updates, node drains).
  pdb:
    enabled: false
    # Set ONE of minAvailable or maxUnavailable (not both).
    minAvailable: ""         # e.g. 1 or "50%"
    maxUnavailable: 1        # Used when minAvailable is empty
  # Horizontal pod autoscaler (it owns the replica count when enabled).
  # Requires metrics-server in the cluster.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ""  # Optional, e.g. 80
  # What stays per pod with several replicas: the WebSocket connection cap
  # (50 sockets per client address, counted by the pod that holds them, so N
  # pods admit up to N times that), and caches each pod rebuilds on its own
  # (health / version / setup checks, GitHub installation tokens, metrics
  # gauges). A Local daemon is one socket on one pod; viewers and REST calls
  # on the others reach it over Redis (docs/optio-local.md).

# ──────────────────────────────────────────────────────────────────────────────
# Web UI
# ──────────────────────────────────────────────────────────────────────────────
# Runs as a second container in the API pod, so it follows the API's
# replicas, autoscaling, PDB, anti-affinity and nodeSelector.
web:
  image:
    repository: ghcr.io/jonwiggins/optio-web
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  service:
    type: ClusterIP    # Set to NodePort for local K8s dev (Docker Desktop, kind, minikube)
    nodePort: ""       # Fixed node port when type=NodePort, e.g. 3100
  # The origin the BROWSER reaches the API at when it is not the web's own:
  # a NodePort install (http://localhost:30400) or an API on a host of its
  # own (https://api.example.com). Origin only, no /api path. The web derives
  # its WebSocket URLs from it and the API its OAuth callback URLs
  # (<origin>/api/auth/<provider>/callback), which otherwise come from
  # publicUrl. Leave it empty behind one ingress: publicUrl covers both. With
  # api.service.type=NodePort and nothing here, the web alone falls back to
  # http://localhost:<nodePort>; the API keeps publicUrl for its callbacks.
  publicApiUrl: ""
  # Server-side rendering for everyone: raise the limits (e.g. 1 CPU, 768Mi)
  # for a large organization.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ──────────────────────────────────────────────────────────────────────────────
# Ask Optio (the assistant)
# ──────────────────────────────────────────────────────────────────────────────
optio:
  assistant:
    # Where an Ask Optio turn runs:
    #   api-pod    (default) as a child process of the API, in the API pod —
    #              no agent pod per conversation. The API image carries Claude
    #              Code and Codex for it; an assistant on another harness, or
    #              one with a repo, runs in an agent pod regardless.
    #   agent-pod  a pooled agent pod per conversation (the assistant isolated
    #              from the API: its own resources, nothing of the API's
    #              filesystem or service account within its reach).
    placement: api-pod
    # Turns the API pod runs at once; the rest go to agent pods.
    inPodMax: 3
  # The legacy dedicated assistant pod (below). Off by default: nothing in
  # Optio uses it. Set true to run it.
  enabled: false
  image:
    repository: ghcr.io/jonwiggins/optio-optio
    tag: latest
    pullPolicy: IfNotPresent
  # Kubernetes nodeSelector for the optio assistant pod (opt-in).
  nodeSelector: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ──────────────────────────────────────────────────────────────────────────────
# Agent containers
# ──────────────────────────────────────────────────────────────────────────────
# References to pre-existing Kubernetes Secrets, keyed by environment variable.
# Values never enter the Helm release or chart-managed Secret. API container only.
# Example: DATABASE_URL: { name: optio-runtime, key: database-url }
# Required for managed services: DATABASE_URL, REDIS_URL, OPTIO_ENCRYPTION_KEY.
# OAuth uses GITHUB_OAUTH_CLIENT_ID/GITHUB_OAUTH_CLIENT_SECRET (or GOOGLE_,
# GITLAB_, OIDC_ISSUER_URL/OIDC_CLIENT_ID/OIDC_CLIENT_SECRET).
# LDAP_BIND_PASSWORD and OPTIO_SETUP_TOKEN can come from here too (docs/sign-in.md).
existingSecrets: {}

agent:
  # Separate identity from the API's Kubernetes administrator service account.
  # Attach an EKS Pod Identity/IRSA role here only when agents need AWS access.
  serviceAccount:
    create: true
    name: "" # defaults to <release>-agent
    annotations: {}
  image:
    repository: ghcr.io/jonwiggins/optio-agent-base
    tag: latest
    pullPolicy: IfNotPresent
    # Prefix used to resolve preset images (base, node, python, go, rust, full, dind).
    # The full image name is: {prefix}{preset}:{tag}
    # GHCR: ghcr.io/jonwiggins/optio-agent-  →  ghcr.io/jonwiggins/optio-agent-node:latest
    # Local: optio-                           →  optio-node:latest
    prefix: "ghcr.io/jonwiggins/optio-agent-"
  # The image presets whose images this deployment has (OPTIO_AGENT_PRESETS),
  # e.g. [base, node, python, go, rust, full]. A repo can pick only these, and
  # a run on a repo with another one fails at once, naming it, instead of
  # waiting on an image that never pulls. Empty = every preset. `base` always counts.
  presets: []
  # How long a pod stays out of the idle reaper for a run that needs recovery
  # (OPTIO_RECOVERY_POD_RETENTION_MS, in ms). 0 = the API's default, 24 hours.
  recoveryPodRetentionMs: 0
  imagePullPolicy: IfNotPresent
  # Envoy sidecar proxy for secret isolation.
  # When repos.secretProxy is enabled, this image is added as a sidecar to agent pods.
  # The sidecar intercepts outbound HTTPS requests and injects auth headers so the
  # agent container never sees raw secrets (GitHub token, Anthropic API key).
  envoyProxy:
    image:
      repository: envoyproxy/envoy
      tag: v1.31-latest
      pullPolicy: IfNotPresent
  # PVC template for repo pod home directories.
  # These PVCs are created dynamically by the API server (one per repo pod
  # instance), but this template controls the storage class and default size.
  pvc:
    storageClass: ""  # Empty = cluster default storage class
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  # Kubernetes scheduling constraints for agent pods.
  # nodeSelector pins pods to nodes with matching labels (e.g. a dedicated node pool).
  # tolerations allow pods to schedule on tainted nodes.
  nodeSelector: {}
  #  cloud.google.com/gke-nodepool: agents
  tolerations: []
  #  - key: optio.dev/agents
  #    operator: Equal
  #    value: "true"
  #    effect: NoSchedule
  # Agent policy (docs/agent-policy.md): the Kubernetes RuntimeClass every
  # agent pod runs under, for a sandbox between the agent and the node, e.g.
  # gVisor (`gvisor`, handler runsc) or Kata Containers (`kata`) on RKE2. The
  # class must exist in the cluster (`kubectl get runtimeclass`); empty = the
  # cluster's default runtime, as upstream. Docker-in-Docker (the dind preset)
  # can't run under gVisor. (OPTIO_AGENT_RUNTIME_CLASS)
  runtimeClassName: ""
  # The RuntimeClasses a repo may pick over that one (Repos → the repo →
  # Agent policy). Optio's namespaced account can't list the cluster's
  # classes, so name the ones it has; a repo asking for another is refused,
  # as an image preset the deployment lacks is. (OPTIO_AGENT_RUNTIME_CLASSES)
  runtimeClasses: []
  #  - gvisor
  #  - kata
  # StatefulSet/Job configuration for agent pods.
  # When enabled, repo pods are managed by StatefulSets and workflow pods by
  # Jobs. This enables Karpenter (and other node autoscalers) to provision
  # nodes for agent workloads. Set to false for bare-pod mode (legacy).
  statefulSet:
    enabled: true
    terminationGracePeriodSeconds: 300
  # Rootless mode for clusters that forbid root containers (restricted
  # PodSecurity, OpenShift, rootless runtimes). Skips the root-running
  # home-perm-fix initContainer on agent StatefulSets and relies on
  # fsGroup + fsGroupChangePolicy=OnRootMismatch for PVC ownership, and
  # stamps runAsNonRoot on agent pods. Requires a CSI driver that honors
  # fsGroup (most cloud CSI drivers do; hostpath-style ones often don't).
  rootless: false
  # Shared cache directory PVCs (opt-in per repo).
  # Controls storage class and size limits for cache directories.
  cache:
    enabled: true                     # Set false to hard-disable the feature
    storageClass: ""                  # Empty = cluster default storage class
    maxSizePerDirectoryGi: 100        # Max size for a single cache directory
    maxSizeTotalGi: 200               # Max total cache size across all dirs per repo
    defaultSizePerDirectoryGi: 10     # Default size when creating a cache directory
  # Repo init timeout (how long to wait for clone to complete)
  repoInitTimeoutMs: 120000           # 2 min default; increase for large repos
  # Environment for every agent pod, rendered into the ConfigMap
  # <release>-agent-env and loaded with envFrom: package mirrors (an
  # Artifactory or Nexus with a private registry), proxies, a model gateway.
  # Variables Optio sets for a run win over these. The API pod loads the same
  # ConfigMap for the turns that run there (optio.assistant.placement), and
  # the MCP server forms warn when an npx / pip / uvx command has no mirror.
  #   NPM_CONFIG_REGISTRY: https://artifactory.example/artifactory/api/npm/npm/
  #   # corepack (a repo's own pnpm or yarn version) reads only its own variable.
  #   COREPACK_NPM_REGISTRY: https://artifactory.example/artifactory/api/npm/npm/
  #   PIP_INDEX_URL: https://artifactory.example/artifactory/api/pypi/pypi/simple
  #   # uv / uvx read their own variable, not PIP_INDEX_URL (both spellings: the
  #   # newer UV_DEFAULT_INDEX and the older UV_INDEX_URL).
  #   UV_DEFAULT_INDEX: https://artifactory.example/artifactory/api/pypi/pypi/simple
  #   UV_INDEX_URL: https://artifactory.example/artifactory/api/pypi/pypi/simple
  #   GOPROXY: https://artifactory.example/artifactory/api/go/go
  #   ANTHROPIC_BASE_URL: https://llm-gateway.example
  env: {}
  # Who agents commit as (GIT_BOT_NAME / GIT_BOT_EMAIL on the API, which hands
  # them to every agent pod). Empty = "Optio Agent" <optio-agent@localhost>
  # when set; otherwise agents use the GitHub App bot identity.
  git:
    botName: ""   # e.g. "Optio Agent"
    botEmail: ""  # e.g. optio-agent@gitlab.example.com

# Per-IP API rate limit (requests per minute). The web UI proxies through the
# Next server, but the iOS app and CLI talk to the API directly and poll several
# endpoints, so keep this comfortably above their steady-state traffic.
rateLimit:
  maxPerMinute: 600
  # The proxies in front of the API whose X-Forwarded-For it believes, so
  # the limits (and the stricter sign-in ones) count each person's address
  # rather than the proxy's — behind an ingress everyone would otherwise
  # share one bucket. "" = one hop when ingress.enabled, else none; a number
  # of hops, "true" (any — only if nothing else can reach the API), or
  # addresses / CIDRs. (OPTIO_TRUST_PROXY)
  trustProxy: ""

# The audit trail (docs/audit.md): sign-ins, merges, tokens, membership and
# settings changes, read on the Audit page (workspace and deployment admins)
# and exported there as CSV or JSON lines.
audit:
  # Days an entry is kept before the daily prune removes it; a deployment
  # admin can change it on the Audit page, which then wins over this.
  # Whole days, 1 to 36500. (OPTIO_AUDIT_RETENTION_DAYS)
  retentionDays: 365
  # "json" also prints each entry to the API's stdout as one JSON line
  # (`"type":"optio.audit"`) for the log collector that feeds your SIEM;
  # "" leaves the trail in the database only. (OPTIO_AUDIT_STDOUT)
  stdout: ""

# Gateway keys Optio makes in LiteLLM (docs/model-gateway.md "Keys Optio
# makes"). Whether people paste their own keys, press "Get my token", or
# may do either, the LiteLLM admin key and what a new key gets (budget,
# period, models, expiry, a team's budget) are set per gateway in the app:
# Settings → Model gateway → the gateway → How people get tokens (workspace
# admins). Here only how often Optio looks at the keys it made: it saves
# their spend, emails the owner (a team's admins) at 80% and 100% of the
# budget, blocks in LiteLLM a key whose owner left the workspace or pasted
# another token over it, and takes spend a new key carried from an earlier
# one off once that key's period is over. Minutes, 1 or more; each key is
# looked at once per interval on the housekeeping tick.
# (OPTIO_GATEWAY_KEY_CHECK_MINUTES)
gatewayKeys:
  checkMinutes: 10

# The ticket round trip and traceable commits (docs/ticket-round-trip.md).
# What Optio writes on a ticket — comments with links to the run and the merge
# request, the work's link, a status per step — and which ticket comments
# resume the work are each ticket provider's own settings, in the app: Settings → Integrations → Tickets →
# the provider → Round trip (whoever may change the provider). Here only the
# deployment's side.
tickets:
  # Traceable merge requests and commits (off by default). true: the merge
  # request's title carries the Jira key and its description ends with a
  # footer naming the ticket, who asked and the run; and every commit an
  # agent makes in a repo pod ends with trailers naming who asked for it and
  # the run that made it — Co-authored-by: <requester>, Optio-Run:
  # <PUBLIC_URL>/work/<id>, Optio-Team: <team> for a team's work, Jira: <key>
  # for work from a Jira ticket — added by a prepare-commit-msg hook Optio
  # installs in the pod (the author stays Optio's bot).
  # (OPTIO_WORK_TRACEABILITY)
  traceability: false
  # With traceability on, the commit trailers are on unless this says false;
  # false leaves them out, and the MR title's Jira key and footer stay. Unset,
  # nothing is rendered and the API's default (on) applies.
  # (OPTIO_COMMIT_TRAILERS)
  # commitTrailers: true
  # How many times comments on a Jira ticket may resume one piece of work;
  # then Optio says once on the ticket that it takes no more, and a person
  # continues from Optio. (OPTIO_TICKET_FOLLOW_UP_LIMIT)
  followUpLimit: 10

# Credential health (docs/credential-health.md): one API instance checks every
# token Optio holds — the organization's, each team's and each person's GitLab
# token (expiry, scopes, revoked, Maintainer on the projects with Optio's
# webhooks), every model-gateway token (LiteLLM /key/info: expiry, spend
# against its budget, the reset), Jira and remote-workspace connections — shows the
# results on Settings → System health and My tokens, and emails the token's
# owner 30, 7 and 1 days before it expires and when it is refused or over
# budget (through the relay under notifications.smtp). A GitLab token is sent
# only to the hosts in gitlab.hosts and the setup wizard's GitLab host, never
# to a host only a repo names: list every GitLab the operator uses there.
credentialHealth:
  # Minutes between passes, e.g. 15; 0 (the default) leaves the periodic
  # checks and their warnings off (Check now on the page still works).
  # (OPTIO_CREDENTIAL_HEALTH_INTERVAL_MINUTES)
  intervalMinutes: 0
  # Before a run's pod is created, ask the gateway about the token the run
  # will carry, and fail the run at once when the gateway already refuses it
  # (over budget, expired, blocked, rejected), saying whose token it is and
  # where to fix it. An unreachable gateway lets the run go on. It applies
  # only to runs through a model gateway. Unset, nothing is rendered and the
  # API's default (on) applies; false turns it off, true renders it on.
  # (OPTIO_GATEWAY_PREFLIGHT)
  # gatewayPreflight: false

# Outbound URL guard (SSRF). URLs people type that the API itself fetches —
# outbound webhooks, Slack notifications, ticket providers, connection health
# checks — may never point at loopback, link-local (cloud metadata), multicast
# or reserved addresses, and not at private ranges unless allowed here. An
# in-cluster API is a common, legitimate target: allow every private range, or
# list the hosts (names, "*.suffix" names, IPs or CIDRs; a listed host is
# allowed whatever it resolves to, loopback included).
outbound:
  allowPrivate: false
  allowedHosts: []   # e.g. ["*.svc.cluster.local", "vault.internal", "10.1.0.0/16"]

# Certificates of the CAs your own services use (a git server, the identity
# provider, registries, a package mirror). The API trusts them, and so does
# every agent pod: an init container appends them to the image's bundle and
# SSL_CERT_FILE, GIT_SSL_CAINFO, NODE_EXTRA_CA_CERTS & co. point at the result.
caBundle:
  pem: ""          # PEM text; rendered into the ConfigMap <release>-ca-bundle
  configMap: ""    # or the name of an existing ConfigMap in the namespace
  key: ca.crt      # the key holding the PEM in that ConfigMap

# ──────────────────────────────────────────────────────────────────────────────
# Network Policy
# Default-deny policy for agent (repo) pods. Restricts cluster-internal
# traffic so compromised pods cannot reach PostgreSQL, Redis, or other
# services directly. Requires a CNI plugin that supports NetworkPolicy
# (e.g. Calico, Cilium, Weave Net). Not supported on Docker Desktop.
# ──────────────────────────────────────────────────────────────────────────────
networkPolicy:
  enabled: false  # Set to true when your cluster supports NetworkPolicy
  # Agent egress allowlist (docs/agent-policy.md "Egress"). Empty: upstream's
  # rule, agent pods reach DNS, the Optio API and any host on ports 443 and
  # 80. Not empty: DNS, the Optio API and only these, for every agent pod
  # (repo pods, Job pods and persistent agents' pods). List the deployment's git
  # host, the model gateway and the package mirrors; a host behind the deployment's
  # ingress is the ingress controller's address or pods. NetworkPolicy takes
  # addresses, not host names. Each entry: a `name` (shown under Workspace
  # settings → Agent policy), then `cidr`, `cidrs` (with optional `except`)
  # or a `namespace` (with optional `podLabels`), and `ports` (default [443]).
  agentEgress: []
  #  - name: GitLab
  #    cidr: 10.20.0.15/32
  #    ports: [443, 22]
  #  - name: The deployment's ingress (the model gateway, the package mirror)
  #    namespace: ingress-nginx
  #    podLabels: { app.kubernetes.io/name: ingress-nginx }
  #    ports: [443]

# Marketplace skills (issue #497) are synced into the database
# (`installed_skill_files`), so every API pod serves them and no volume is
# involved; the former `installedSkillsCache` PVC is gone and the value is
# ignored.

# ──────────────────────────────────────────────────────────────────────────────
# Config as code (docs/config-as-code.md)
#
# A directory of YAML manifests — Jobs, scheduled Tasks, agents, prompts,
# repos, MCP servers, skills, connections — that the API reads every
# `interval` and applies to one workspace. The files are the truth: a manifest
# that changes is applied, one that disappears is pruned (unless prune=false),
# and a managed resource edited in the UI is put back at the next sync.
#
# Feed the directory one of three ways:
#   files:     inline manifests, rendered into a ConfigMap by this chart
#   configMap: the name of a ConfigMap you maintain (each key is a file)
#   api.extraVolumes / api.extraVolumeMounts: anything else (a PVC, a sync
#              sidecar's volume) mounted at `mountPath`
# ──────────────────────────────────────────────────────────────────────────────
configAsCode:
  enabled: false
  # Where the directory is mounted in the API container (OPTIO_CONFIG_DIR).
  mountPath: /etc/optio-config
  # The workspace the manifests belong to, by slug. Empty = the oldest
  # workspace (the organization's, as the sign-in bootstrap makes it).
  workspace: ""
  # Delete resources whose manifest is gone (OPTIO_CONFIG_PRUNE).
  prune: true
  # How often the directory is read, in milliseconds (OPTIO_CONFIG_INTERVAL).
  intervalMs: 60000
  # An existing ConfigMap to mount as the directory (one key per file, e.g.
  # "work-nightly.yaml"). Takes precedence over `files`.
  configMap: ""
  # Inline manifests, one key per file name; rendered into a ConfigMap.
  # files:
  #   nightly-bump.yaml: |
  #     apiVersion: optio/v1
  #     kind: Work
  #     metadata: { name: nightly-dependency-bump }
  #     spec: { ... }
  files: {}

# A small image with sh, wget and nc: the built-in PostgreSQL's init containers
# and the `helm test` pods run it. Point it at a private mirror when the
# cluster cannot pull from Docker Hub.
utilityImage:
  repository: busybox
  tag: "1.36"

# ──────────────────────────────────────────────────────────────────────────────
# PostgreSQL (built-in)
# Set enabled=false and configure externalDatabase.url for managed Postgres.
# ──────────────────────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Kubernetes nodeSelector for PostgreSQL pods (opt-in).
  nodeSelector: {}
  storage:
    storageClass: ""  # Empty = cluster default storage class
    size: 5Gi
  auth:
    database: optio
    username: optio
    # REQUIRED when auth is enabled. Override this in production.
    password: ""
  # TLS encryption for the in-cluster Postgres connection.
  # When enabled, a self-signed CA + server cert are generated at install time
  # and the DATABASE_URL is configured with sslmode=verify-full.
  tls:
    enabled: true

# ──────────────────────────────────────────────────────────────────────────────
# Redis (built-in)
# Set enabled=false and configure externalRedis.url for managed Redis.
# ──────────────────────────────────────────────────────────────────────────────
redis:
  # Optional port probe for TLS, or accept NOAUTH from password-protected Redis.
  connectionTestTlsAware: false
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  # Kubernetes nodeSelector for Redis pods (opt-in).
  nodeSelector: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # TLS encryption for in-cluster Redis. Encrypts data in transit (BullMQ job
  # payloads, pub/sub log streams) with TLSv1.3. Recommended for production.
  tls:
    enabled: true
    # When true, generates a self-signed CA + server cert at install time via
    # Helm's genSignedCert. Set to false if providing certs externally
    # (e.g., cert-manager) and populate redis.tls.existingSecret.
    autoGenerateCert: true
    # Name of an existing TLS Secret (type kubernetes.io/tls with ca.crt key).
    # Only used when autoGenerateCert is false.
    existingSecret: ""
  # Redis password authentication (requirepass). Strongly recommended alongside TLS.
  auth:
    enabled: true
    # Leave empty to auto-generate a 32-char password at install time.
    # The password is stored in a K8s Secret and persisted across upgrades.
    password: ""

# ──────────────────────────────────────────────────────────────────────────────
# External services (used when built-in PostgreSQL/Redis are disabled)
# ──────────────────────────────────────────────────────────────────────────────

# REQUIRED when postgresql.enabled=false
externalDatabase:
  url: ""  # e.g., postgres://user:pass@host:5432/optio

# REQUIRED when redis.enabled=false
externalRedis:
  # Standalone: one URL. Cluster: a comma-separated list of seed nodes — one
  # entry for ElastiCache Serverless, which always runs in cluster mode.
  url: ""  # e.g., rediss://:password@host:6379 (use rediss:// for TLS)
  # "standalone" (default) or "cluster" (Redis Cluster / ElastiCache
  # Serverless). In cluster mode every client is cluster-aware and every
  # BullMQ queue lives under a hash-tagged key prefix (see docs/redis.md).
  mode: standalone
  # BullMQ key prefix. Empty = "bull" standalone, "{optio}" in cluster mode
  # (cluster mode requires a {hash-tag}). Set to share one Redis Cluster
  # between Optio installs, e.g. "{optio-staging}".
  queuePrefix: ""

# ──────────────────────────────────────────────────────────────────────────────
# Database backups (optional; docs/backup.md)
# A CronJob that dumps Optio's database — the built-in PostgreSQL, or the
# external one in DATABASE_URL — with `pg_dump -Fc`, reads every dump back
# with `pg_restore --list` before keeping it, and keeps the newest on a volume
# (target: pvc) or in an S3-compatible bucket with a private registry (target:
# s3: MinIO, Ceph RGW, …). scripts/backup/backup-db.sh (and the pipeline's
# deploy jobs) take a dump with it before every upgrade;
# scripts/backup/restore-db.sh restores one. A dump is useless without the
# encryption key it was made with (encryption.key / OPTIO_ENCRYPTION_KEY):
# keep the key with the dumps, apart from the cluster.
# ──────────────────────────────────────────────────────────────────────────────
backup:
  enabled: false
  # Cron, in timeZone (empty: the controller's, usually UTC).
  schedule: "15 2 * * *"
  timeZone: ""          # e.g. "Asia/Jerusalem"
  suspend: false        # true: no scheduled runs (dumps before upgrades still run)
  # Scheduled and by-hand dumps kept (the newest), and, apart from them,
  # dumps taken before upgrades.
  keep: 7
  keepPreUpgrade: 3
  # Where the dumps go: "pvc" or "s3".
  target: pvc
  pvc:
    # A claim you made (e.g. on other storage than PostgreSQL's); empty: the
    # chart makes <release>-backup once and never deletes it (it outlives
    # `helm uninstall`).
    existingClaim: ""
    size: 20Gi
    storageClass: ""    # empty = the cluster's default
    accessMode: ReadWriteOnce
  s3:
    # https://minio.example.com:9000 — its certificate is trusted through
    # caBundle (your CA) next to the image's CAs. Empty: AWS's own endpoints.
    endpoint: ""
    bucket: ""
    prefix: "optio/"    # e.g. the environment's name; the dumps go under it
    region: us-east-1
    pathStyle: true     # https://endpoint/bucket/key (MinIO, Ceph); false: bucket.endpoint
    # A Secret in the namespace with the access key (its key names below), or
    # the two values here (rendered into <release>-backup-s3).
    existingSecret: ""
    existingSecretKeys:
      accessKeyId: AWS_ACCESS_KEY_ID
      secretAccessKey: AWS_SECRET_ACCESS_KEY
    accessKeyId: ""
    secretAccessKey: ""
    # An image with the AWS CLI for the upload and download (the offline
    # kit's base/k8s; set its repository to your mirror).
    image:
      repository: alpine/k8s
      tag: "1.34.12"
    # The pod's scratch space for one dump between pg_dump and the upload.
    scratchSize: 20Gi
  # The image pg_dump and pg_restore come from; empty: postgresql.image (16).
  # An external PostgreSQL newer than 16 needs that version's image here.
  image:
    repository: ""
    tag: ""
  # More pg_dump arguments, e.g. ["--exclude-table-data=task_logs"].
  pgDumpArgs: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  backoffLimit: 1
  activeDeadlineSeconds: 7200      # a dump or a restore that takes longer fails
  ttlSecondsAfterFinished: 604800  # finished jobs (and their logs) go after 7 days
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  nodeSelector: {}
  tolerations: []

# ──────────────────────────────────────────────────────────────────────────────
# Public URL
# REQUIRED when auth is enabled. The externally-reachable URL where both web
# and API are served (same origin via ingress path routing).
# Used for OAuth callbacks, Slack links, etc.
# ──────────────────────────────────────────────────────────────────────────────
publicUrl: ""  # e.g. https://optio.example.com

# ──────────────────────────────────────────────────────────────────────────────
# Workspaces
# ──────────────────────────────────────────────────────────────────────────────
workspaces:
  # Who sees whose work, for a workspace that hasn't picked (Workspace
  # settings → Access → Work visibility): "organization" (the default) — the
  # organization's work is everyone's in the workspace; or "teams" — a member
  # sees their own work, their teams' and what they created, admins
  # everything. See docs/teams.md.
  workVisibility: organization
  # The name of the organization workspace the first sign-in creates when
  # there is no workspace yet; empty = "Organization". An existing workspace
  # keeps its name. (OPTIO_ORGANIZATION_NAME)
  organizationName: ""
  # Who may create a workspace (and so become its admin): "everyone" signed
  # in (the default), or "admins" — only a deployment admin
  # (auth.deploymentAdmins, the admin groups, or one made in the app), who is
  # then also the only one to change organization-wide (global) secrets;
  # people still get into the organization workspace, and the ones their
  # directory groups open, by signing in. A deployment admin can change it in
  # the app (Settings → Access → Workspaces), which wins over this value.
  # Opening a workspace to directory groups is always a deployment admin's.
  # (OPTIO_WORKSPACE_CREATION)
  creation: everyone

# Starter prompts: organization prompts for common jobs (a Claude Code skill,
# a CLAUDE.md, a review, a safe refactor, …). Off by default: an admin adds
# them from the Prompts page ("Add starter prompts"). true: the first boot
# adds them. (OPTIO_STARTER_PROMPTS)
prompts:
  starters: false

# Teams (docs/teams.md): a third scope next to the organization and one
# person — work, secrets, prompts and ticket providers a team owns, its own
# gateway token and agent-policy rules. Off by default: no Teams page, no Team
# choice in pickers, and /api/teams answers 404. A deployment admin can change
# it in the app (Settings → Access → Teams), which wins over this value.
# (OPTIO_TEAMS_ENABLED)
teams:
  enabled: false

# Automatic merging (docs/tasks.md). Off by default: the "merge
# automatically" checkbox alone decides. true: turning it on needs the
# checkbox AND a confirmation dialog, and Optio merges only what someone
# confirmed. A deployment admin can change it in the app (Settings → Access →
# Automatic merging), which wins over this value. (OPTIO_MERGE_CONFIRMATION)
merge:
  confirmation: false

# The getting-started guide (docs/using-optio.md): a checklist on the Overview
# for each person (sign-in, a repository, a first task and review, …) and Help
# → Using Optio in the account menu. Off by default. A deployment admin can
# change it in the app (Settings → Access → Getting-started guide), which wins
# over this value. (OPTIO_ONBOARDING)
onboarding:
  enabled: false

# ──────────────────────────────────────────────────────────────────────────────
# Authentication
# When auth.disabled=false (the default), publicUrl is REQUIRED. An OAuth
# provider is optional here: with none configured, the setup wizard's Sign-in
# step configures the organization's Google sign-in from the browser, unlocked
# by the setup token (auth.setupToken, or the one the API prints in its log).
# OpenID Connect and LDAP / Active Directory can be set up there too. A
# provider saved in the app takes precedence over the values below. See
# docs/sign-in.md.
# ──────────────────────────────────────────────────────────────────────────────
auth:
  # Link new identities by provider-verified email, preserving the original identity.
  linkAccountsByEmail: false
  # Set to true to disable authentication (NOT recommended for production).
  disabled: false
  # One-time token that unlocks the setup wizard's Sign-in step while nobody
  # can sign in yet (and lets a signed-in person claim the deployment-admin
  # role on a deployment that has none). Leave empty to have the API generate
  # one and print it: kubectl logs deploy/optio-api -n optio | grep "setup token"
  setupToken: ""
  # Emails that are deployment admins (may change how everyone signs in),
  # besides the ones made so in the app. e.g. ["ops@example.com"]
  deploymentAdmins: []
  # OAuth provider credentials — optional (see above).
  github:
    clientId: ""
    clientSecret: ""
  google:
    clientId: ""
    clientSecret: ""
  gitlab:
    clientId: ""
    clientSecret: ""
    # baseUrl: https://gitlab.com  # Self-hosted GitLab URL
    # "Use my GitLab account for my work": sign-in also asks for the api
    # scope and keeps each person's GitLab token (refreshed before it
    # expires) for their work on that GitLab, after a token they saved
    # themselves and before the organization's (docs/sign-in.md).
    storeUserToken: false
  # Generic OIDC provider: the organization's own (Keycloak, Authentik, ADFS,
  # Entra ID, Okta, Zitadel, Authelia, Auth0, …). Set issuerUrl to turn it on. Register the redirect URI <publicUrl>/api/auth/oidc/callback
  # (<web.publicApiUrl>/api/auth/oidc/callback when the API has an origin of
  # its own) with the provider.
  oidc:
    issuerUrl: ""       # e.g. https://auth.example.com/realms/optio (serves /.well-known/openid-configuration)
    clientId: ""
    clientSecret: ""
    displayName: "SSO"  # Button label: "Sign in with {displayName}"
    scopes: ""          # Defaults to "openid email profile" if empty
    groupsClaim: ""     # The claim carrying the person's groups; empty = "groups" (Keycloak realm roles: realm_access.roles)
    adminGroups: []     # Members become deployment admins and admins of the organization workspace, e.g. ["optio-admins"]
    requiredGroups: []  # Only members of one of these may sign in; empty = everyone the provider knows
    trustEmail: false   # true: count the email as verified without the provider's email_verified claim (most self-hosted providers send none)
    usePkce: false      # true: PKCE (S256) on the sign-in, for a provider that supports it
    autoJoinOrganization: false  # true: everyone who signs in joins the organization workspace
    linkByEmail: false  # true: a first sign-in whose verified email matches one existing account gets that account; only if people can't change their email at the provider
    caPem: ""           # PEM bundle of the CA behind a private provider certificate (caBundle below covers it too)
  # LDAP / Active Directory: a username + password form on the login page,
  # for a network without an OpenID Connect provider. Set url to turn it on.
  ldap:
    url: ""                   # ldap:// or ldaps:// URL, e.g. ldaps://ad.example.com:636
    startTls: false           # Upgrade a plain ldap:// connection with STARTTLS before binding
    bindDn: ""                # Service account for the user search, e.g. CN=optio,OU=Service,DC=example,DC=com; empty = anonymous bind
    bindPassword: ""          # Its password (or existingSecrets.LDAP_BIND_PASSWORD)
    userBaseDn: ""            # Where users live, e.g. OU=People,DC=example,DC=com (required with url)
    userFilter: ""            # {{username}} placeholder; empty = (|(sAMAccountName={{username}})(uid={{username}})(mail={{username}}))
    usernameAttribute: ""     # empty = sAMAccountName, then uid
    emailAttribute: ""        # empty = mail
    displayNameAttribute: ""  # empty = displayName, then cn
    groupMode: ""             # "memberOf" (the attribute on the user; the default) or "search" (a group search)
    groupBaseDn: ""           # groupMode search: where groups live
    groupFilter: ""           # groupMode search: {{dn}} / {{username}} placeholders; empty = (|(member={{dn}})(uniqueMember={{dn}})(memberUid={{username}}))
    adminGroups: []           # Group names (the CN) whose members become deployment admins and organization admins
    requiredGroups: []        # Only members of one of these may sign in; empty = everyone the directory knows
    linkByEmail: false        # true: a first sign-in whose email matches one existing account gets that account; only if people can't change their own mail attribute
    displayName: "Corporate account"  # The form's heading on the login page
    caPem: ""                 # PEM bundle of the CA behind the directory's certificate (caBundle below covers it too)
  # Directory sync (docs/directory-sync.md): every intervalMinutes Optio
  # re-reads each person who signs in with LDAP / Active Directory, through
  # the LDAP service account (bindDn above, or the one saved in the app), and
  # applies their groups as a sign-in would: admin groups, the workspaces
  # their groups open, group-mapped teams. Someone who left — entry gone,
  # disabled in Active Directory (userAccountControl), out of every
  # requiredGroup, or an email domain no longer allowed — is disabled: their
  # sessions and API keys stop working, their own schedules and triggered
  # automations are paused, their workspaces' and teams' admins are told.
  # Back in the groups, the account comes back on. Needs LDAP sign-in;
  # people who sign in with OpenID Connect are checked by their provider at
  # every sign-in. A deployment admin can change enabled and the interval in
  # the app (Settings → Access → Directory sync), which wins over these.
  directorySync:
    enabled: false            # Run on a schedule (OPTIO_DIRECTORY_SYNC)
    intervalMinutes: 30       # 15 to 1440 (OPTIO_DIRECTORY_SYNC_INTERVAL_MINUTES)
    # A run that would disable more than this percent of the people it checked
    # (and more than three) changes nobody until a deployment admin runs it
    # again with "Disable them anyway"; 100 turns the check off.
    maxDisablePercent: 25     # (OPTIO_DIRECTORY_SYNC_MAX_DISABLE_PERCENT)

# ──────────────────────────────────────────────────────────────────────────────
# GitHub webhook signature validation
# ──────────────────────────────────────────────────────────────────────────────
webhook:
  # The receivers (/api/webhooks/github, /api/webhooks/slack/events,
  # /api/webhooks/slack/actions, /api/webhooks/linear, /api/webhooks/pagerduty,
  # /api/webhooks/gitlab, /api/webhooks/jira, /api/webhooks/sentry) take no
  # Optio session; each rejects every delivery until its secret below is set.
  # (Pylon, Alertmanager / Grafana and Datadog deliveries go to
  # /api/hooks/<type>/<trigger id> and carry the trigger's own shared secret —
  # nothing to set here.)
  githubSecret: ""  # Generate with: openssl rand -hex 32. Must match GitHub's webhook config.
  # Slack event triggers and the retry/cancel buttons on Slack notifications,
  # plus Linear and PagerDuty event triggers.
  slackSigningSecret: ""  # Slack app → Basic Information → Signing Secret
  linearSecret: ""  # Linear → Settings → API → Webhooks → signing secret
  pagerdutySecret: ""  # PagerDuty → Integrations → Generic Webhooks (v3) → the subscription's signing secret
  # Optional: Optio registers a project webhook itself when a GitLab repo is
  # added, with a secret it generates and stores; set this only to use your
  # own token on hooks you make by hand (GitLab → project / group → Settings →
  # Webhooks → Secret token, sent as X-Gitlab-Token).
  gitlabSecret: ""
  jiraSecret: ""  # Jira → Settings → System → WebHooks → the webhook's secret (X-Hub-Signature)
  sentrySecret: ""  # Sentry → Developer Settings → the internal integration's Client Secret (Sentry-Hook-Signature)

# ──────────────────────────────────────────────────────────────────────────────
# GitHub App (recommended — replaces OAuth App + PAT for GitHub operations)
# Register at https://github.com/organizations/{org}/settings/apps
# Required permissions: Contents R/W, Pull Requests R/W, Issues R/W, Checks R, Metadata R
# ──────────────────────────────────────────────────────────────────────────────
github:
  app:
    # IMPORTANT: id and installationId MUST be quoted strings in your values file.
    # Unquoted large integers are silently truncated by YAML float parsing.
    # Correct:   id: "123456"
    # Wrong:     id: 123456
    id: ""                # App ID (quoted string)
    clientId: ""          # Client ID (for user OAuth login flow)
    clientSecret: ""      # Client secret (for user OAuth login flow)
    installationId: ""    # Installation ID (quoted string)
    privateKey: ""        # PEM private key (for server-side installation tokens)
    # Git commit author for agent commits. Use the GitHub App's bot identity
    # so commits show properly in the GitHub UI.
    # Format: "{app-name}[bot]" and "{app-id}+{app-slug}[bot]@users.noreply.github.com"
    # Find these on your app's settings page at github.com/settings/apps/{slug}
    botName: ""           # e.g. "my-optio-app[bot]"
    botEmail: ""          # e.g. "123456+my-optio-app[bot]@users.noreply.github.com"
    # Use an existing K8s Secret instead of the values above. The secret must
    # contain keys: GITHUB_APP_ID, GITHUB_APP_CLIENT_ID, GITHUB_APP_CLIENT_SECRET,
    # GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY.
    # Optionally also: GITHUB_APP_BOT_NAME, GITHUB_APP_BOT_EMAIL.
    # Useful with external-secrets-operator, sealed-secrets, or vault-injector.
    existingSecret: ""
  # @-mentions in GitHub comments (docs/gitlab-bot.md), as gitlab.bot does for
  # GitLab: "@<bot> add a health check" on an issue or a pull request starts
  # or resumes work as that person, answering in the conversation. The bot
  # is the GitHub App's (people mention its slug), or the machine user named
  # here; never a personal token's user on its own. Off by default; a
  # deployment admin can change all three under Settings → Integrations.
  # The App's webhook (or one Optio registers, OPTIO_REPO_WEBHOOKS) must
  # send issue_comment events.
  bot:
    enabled: false
    username: ""   # empty = the GitHub App's
    rateLimit: 5

# ──────────────────────────────────────────────────────────────────────────────
# Self-hosted GitLab
# Hostnames Optio treats as GitLab (repo URLs, merge requests, pipelines,
# issues); gitlab.com always is one. Optio calls https://<host>/api/v4.
# Credential health checks GitLab tokens against these (and the setup
# wizard's GitLab host) only.
# ──────────────────────────────────────────────────────────────────────────────
gitlab:
  hosts: []        # e.g. ["gitlab.example.com"]
  # Whether GitLab verifies Optio's TLS certificate when delivering to the
  # webhooks Optio registers. Set false when the ingress certificate comes
  # from a CA GitLab does not trust (your own self-signed CA).
  hookSslVerify: true
  # @-mentions in GitLab comments (docs/gitlab-bot.md): someone writes
  # "@optio-bot add a health check" on an issue or a merge request and Optio
  # starts or resumes work as that person, answering in the thread. The bot
  # is the organization GitLab token's own user (Optio asks GitLab who that
  # is) when GitLab says it is a bot (a group, project or service account
  # token); a person's token is refused unless named here. Name it also when
  # people should mention another name. Off by default. A deployment
  # admin can change all three under Settings → Integrations → GitLab bot,
  # which wins. The project webhooks Optio creates already send comment
  # (note) events.
  bot:
    enabled: false
    username: ""   # empty = the organization token's user
    # Requests one person may make on one merge request or issue in 10
    # minutes (1-100).
    rateLimit: 5

# ──────────────────────────────────────────────────────────────────────────────
# Secrets encryption
# REQUIRED. Generate with: openssl rand -hex 32
# ──────────────────────────────────────────────────────────────────────────────
encryption:
  key: ""

# Shared secret for pod-to-API credential requests (git credential helper).
# If empty, derived from the encryption key at startup.
credentialSecret: ""

# ──────────────────────────────────────────────────────────────────────────────
# Ingress
# ──────────────────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  # The ingress template automatically blocks /api/internal/* from public traffic
  # via an nginx server-snippet. These endpoints use bearer token auth (not session
  # auth) and must only be reachable within the cluster. If using a non-nginx ingress
  # controller, add equivalent path-blocking rules in the annotations below.
  annotations: {}
  # How /api/internal/* (bearer-token endpoints meant for pods) is kept off
  # the ingress:
  #   snippet  — an nginx server-snippet; ingress-nginx refuses snippet
  #              annotations unless the controller allows them
  #   denylist — a second Ingress for that path that denies every source
  #              (ingress-nginx, no snippets needed)
  #   none     — your controller blocks it (e.g. a Traefik middleware)
  internalPathBlock: snippet
  # cert-manager TLS support. When enabled, the chart adds the
  # cert-manager.io/cluster-issuer annotation and generates a TLS block
  # for each host automatically.
  certManager:
    enabled: false
    clusterIssuer: letsencrypt-prod
  hosts:
    - host: optio.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
        - path: /ws
          pathType: Prefix
          service: api
  # Manual TLS configuration. When certManager is enabled, TLS entries are
  # generated automatically from hosts — this field is only needed for
  # manual certificate management.
  tls: []
  #  - secretName: optio-tls
  #    hosts:
  #      - optio.example.com

# ──────────────────────────────────────────────────────────────────────────────
# Gateway API
# Alternative to Ingress for clusters running Gateway API (GA in K8s 1.26+).
# Mutually exclusive with ingress — do not enable both.
# ──────────────────────────────────────────────────────────────────────────────
gatewayAPI:
  enabled: false
  # Gateway controller class (required when enabled).
  # Common values: cilium, istio, envoy-gateway
  gatewayClassName: ""
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    # - name: https
    #   port: 443
    #   protocol: HTTPS
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - name: optio-tls
  # Hostname for the Gateway and HTTPRoute. Leave empty for wildcard.
  hostname: ""
  # Annotations for the Gateway resource (e.g., cert-manager).
  gatewayAnnotations: {}
  # Annotations for the HTTPRoute resource (e.g., rate-limiting).
  httpRouteAnnotations: {}

# ──────────────────────────────────────────────────────────────────────────────
# Push Notifications (Web Push API)
# Optional. If publicKey/privateKey are empty, browser push is disabled.
# Generate keys with: npx web-push generate-vapid-keys --json
# ──────────────────────────────────────────────────────────────────────────────
notifications:
  vapid:
    publicKey: ""
    privateKey: ""
    subject: ""  # e.g. mailto:ops@example.com
  # ── iOS push (APNs, token-based auth) — see docs/ios-push.md ──
  # Leave keyId empty to disable. Create a key under Certificates, Identifiers &
  # Profiles → Keys with the "Apple Push Notifications service (APNs)" capability.
  apns:
    keyId: ""          # 10-char key id from the developer portal
    teamId: ""         # 10-char Apple Developer team id
    key: ""            # PEM contents of the AuthKey_<keyId>.p8 file (multi-line ok)
    bundleId: "dev.optio.ios"
    environment: "sandbox"   # sandbox (Xcode builds) | production (TestFlight / App Store)
    # Name of a pre-created Secret carrying OPTIO_APNS_KEY_ID, OPTIO_APNS_TEAM_ID,
    # OPTIO_APNS_KEY (and optionally OPTIO_APNS_BUNDLE_ID / OPTIO_APNS_ENVIRONMENT)
    # for clusters that keep the key out of values. When set, keyId/teamId/key above are ignored.
    existingSecret: ""
  # ── Android push (Firebase Cloud Messaging, HTTP v1) — see docs/android-push.md ──
  # Leave serviceAccount empty to disable. Firebase console → Project settings →
  # Service accounts → Generate new private key; paste the downloaded JSON
  # (or `--set-file notifications.fcm.serviceAccount=sa.json`).
  fcm:
    serviceAccount: ""   # the service-account key JSON (multi-line ok)
    projectId: ""        # optional; defaults to the key's project_id
    # Name of a pre-created Secret carrying OPTIO_FCM_SERVICE_ACCOUNT (and optionally
    # OPTIO_FCM_PROJECT_ID) for clusters that keep the key out of values. When set,
    # serviceAccount / projectId above are ignored.
    existingSecret: ""
  # ── Email through your SMTP relay — see docs/notifications.md ──
  # Optio emails people about their work (a merge request waiting for them,
  # work that needs them or failed) and passes on other parts' notices
  # (budgets, tokens). Each person picks what they get under Settings →
  # Notifications; a deployment admin can set the relay there too, which
  # wins over these values. The relay's certificate is trusted through
  # caBundle above (NODE_EXTRA_CA_CERTS); caPem trusts a CA for the relay
  # alone. Leave url empty for no email.
  smtp:
    # smtp://[user:password@]host[:port][?starttls=required|never]
    #   STARTTLS when the relay offers it (port 587 unless given);
    #   ?starttls=required refuses a relay without it, ?starttls=never never encrypts
    # smtps://[user:password@]host[:port]   TLS from the start (port 465 unless given)
    # Percent-encode @ : / in the user name or password. The URL holds the
    # password: keep it out of values with existingSecrets.OPTIO_SMTP_URL.
    url: ""
    from: ""                    # e.g. "Optio <optio@example.com>"; default optio@<publicUrl's host>
    caPem: ""                   # PEM of the relay's CA, when caBundle doesn't hold it
    insecureSkipVerify: false   # a lab only: don't check the relay's certificate
  # ── Delivery: retries and undelivered mail — see docs/notifications.md ──
  # Every email and chat post (a person's own Mattermost / Teams hook, a
  # team's channel) goes through a queue: a relay or chat that can't be
  # reached is tried again after baseSeconds, then twice as long each time,
  # attempts tries in all (the defaults: about four hours). What still fails,
  # or what the far end refused for good, waits for a deployment admin under
  # Settings → Notifications → Undelivered for deadLetterDays. Chat hooks are
  # reached through the outbound guard: list your chat's host in
  # outbound.allowedHosts (e.g. "mattermost.example.com") when it resolves to
  # a private address; its certificate is trusted through caBundle above.
  delivery:
    attempts: 10                # tries per email or chat post, the first included (1-50)
    baseSeconds: 30             # the first wait; each next one doubles
    deadLetterDays: 30          # how long undelivered ones are kept

# ──────────────────────────────────────────────────────────────────────────────
# Observability (OpenTelemetry)
# Set otel.enabled=true and configure OTEL_EXPORTER_OTLP_ENDPOINT to ship
# traces, metrics, and (optionally) logs to any OTLP backend (Datadog,
# Honeycomb, Grafana Cloud, etc.).
# ──────────────────────────────────────────────────────────────────────────────
observability:
  otel:
    enabled: false
    endpoint: ""             # e.g. https://api.honeycomb.io:443 or http://otel-collector:4318
    protocol: "http/protobuf"
    headers: ""              # Comma-separated key=value, e.g. "x-honeycomb-team=abc123"
    serviceName: "optio-api"
    resourceAttributes: ""   # Extra attrs, e.g. "team=platform,region=us-east-1"
    samplingRatio: "1.0"
    metricsIntervalMs: "60000"
    logsEnabled: false
    debug: false

# ──────────────────────────────────────────────────────────────────────────────
# Monitoring: Prometheus, alerts, a Grafana dashboard (Rancher Monitoring)
# docs/observability.md "Monitoring".
#
# metrics.enabled: the API serves its metrics as Prometheus text on its own
# port (OPTIO_METRICS_PORT) behind its own ClusterIP Service,
# <release>-api-metrics — never on the ingress. No OTLP collector needed
# (with observability.otel on, both get the same metrics). It covers every
# workspace: runs by state and the longest wait, agent pods, credential
# health, ticket providers (their ids and hosts), gateway refusals, and
# this month's spend by workspace, team and model; upstream's series add
# repository URLs (which can name a person's GitLab namespace) and
# workspace ids. Never a secret, a prompt or an error text. It has no
# sign-in: with networkPolicy.enabled, metrics.networkPolicy below lets only
# Prometheus's namespace read the port, and no agent pod can, whatever
# networkPolicy.agentEgress says. Without networkPolicy.enabled anything in
# the cluster that reaches the API pods can read it, agent pods included.
#
# The other three need Rancher Monitoring (rancher-monitoring, the
# Prometheus operator's CRDs) and a deployer allowed to create them
# (servicemonitors / prometheusrules in monitoring.coreos.com; the dashboard
# ConfigMap in cattle-dashboards); each refuses to render without
# metrics.enabled, and the alerts without the ServiceMonitor (or a `job`).
# ──────────────────────────────────────────────────────────────────────────────
metrics:
  enabled: false
  port: 9464
  service:
    annotations: {}
  # With networkPolicy.enabled: a NetworkPolicy on the API pods. Their API
  # and web UI ports stay open to every source, as without it; metrics.port
  # only to pods in these namespaces, the `from` peers, and this release's
  # `helm test` pod. Turn it off only when the namespace's own policies
  # already decide who reaches the API pods (this one opens the API's and
  # the web UI's ports to every source) and let Prometheus in there.
  networkPolicy:
    enabled: true
    namespaces: []   # Namespaces whose Prometheus may scrape the API
    from: []               # more NetworkPolicy peers, e.g. a namespaceSelector with your Prometheus's labels
  # A ServiceMonitor: Rancher Monitoring's Prometheus scrapes the Service.
  serviceMonitor:
    enabled: false
    namespace: ""          # default: the release namespace
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, for a Prometheus whose serviceMonitorSelector wants one
    # (Rancher's selects every ServiceMonitor; kube-prometheus-stack: release: <its release>)
    labels: {}
  # A PrometheusRule with Optio's alerts; Alertmanager routes them like any
  # other (match namespace="<this namespace>" or the alertLabels below).
  # OptioDown, OptioMetricsStale, OptioQueueStuck, OptioRunsStuckProvisioning,
  # OptioPodsStuckProvisioning, OptioRunFailureRate,
  # OptioWebhookDeliveriesFailing, OptioGatewayRefusing, OptioGitLabErrors,
  # OptioTicketProviderFailing, OptioCredentialsExpiring,
  # OptioCredentialsFailing, OptioSignInFailures, OptioRemoteWorkspaceStartSlow.
  prometheusRule:
    enabled: false
    namespace: ""          # default: the release namespace
    labels: {}             # for a Prometheus whose ruleSelector wants one
    alertLabels: {}        # added to every alert, e.g. { team: platform }
    # The `job` label the API's series carry. Empty: the ServiceMonitor's,
    # <release>-api-metrics (then serviceMonitor.enabled is required: with
    # nothing scraping, OptioDown would fire for ever). Set it when your own
    # scrape config reads the endpoint.
    job: ""
    disabled: []           # alert names to leave out, e.g. [OptioSignInFailures]
    thresholds:
      queueStuckMinutes: 30          # the oldest queued run waited this long
      provisioningStuckMinutes: 15   # a run or an agent pod still provisioning
      failureRatio: 0.5              # failed / ended runs over 30 minutes, above this …
      failureMinRuns: 5              # … with at least this many ended
      webhookFailures: 5             # failed outbound webhook deliveries in 15 minutes
      gatewayErrors: 5               # gateway 401 / 403 / 429 in 15 minutes
      gitlabErrors: 10               # GitLab 401 / 403 / 5xx in 15 minutes
      ticketProviderFailures: 3      # a ticket provider's failed syncs in a row (5 turns it off)
      signInFailures: 20             # refused sign-ins in 15 minutes, per provider and reason
      remoteWorkspaceStartMinutes: 15  # a remote workspace Optio started isn't online yet (also read as coderStartMinutes)
    additionalRules: []    # more Prometheus rules for this group, as YAML
  # Optio's dashboard as a ConfigMap Rancher Monitoring's Grafana picks up
  # by its label (Rancher's sidecar watches cattle-dashboards). A Grafana
  # whose sidecar searches every namespace: set namespace to this release's.
  # One per Optio namespace ("Optio · <namespace>", its own file and uid),
  # so test and staging on one cluster each keep theirs.
  grafanaDashboard:
    enabled: false
    namespace: ""
    labels:
      grafana_dashboard: "1"
    annotations: {}        # e.g. { grafana_folder: Optio } where the sidecar reads folders

# ──────────────────────────────────────────────────────────────────────────────
# Namespace
# ──────────────────────────────────────────────────────────────────────────────
namespace: optio
# Render the Namespace object (on by default, as upstream). It is skipped
# when the namespace already exists and this release did not create it (a
# package manager such as Zarf, Rancher or `helm --create-namespace` made
# it). A namespace this release created stays in its manifest, so an
# upgrade never deletes it. false: never render it; set it together with
# `helm install --create-namespace`, which creates the namespace after
# rendering.
createNamespace: true

# ──────────────────────────────────────────────────────────────────────────────
# Namespace resource quotas
# Enable to prevent rogue agents from consuming all cluster resources.
# ──────────────────────────────────────────────────────────────────────────────
resourceQuota:
  enabled: false
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    pods: "50"
    persistentvolumeclaims: "30"

# ──────────────────────────────────────────────────────────────────────────────
# RBAC
# ──────────────────────────────────────────────────────────────────────────────
rbac:
  clusterRole:
    # Set to false for namespace-only deployments where cluster-wide
    # permissions are not available (e.g. shared multitenant clusters).
    # When disabled, the cluster overview page will not show node
    # utilization, but all other functionality works normally.
    create: true

# ──────────────────────────────────────────────────────────────────────────────
# Service account
# ──────────────────────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: optio
  # Annotations for the service account (e.g., for GKE Workload Identity or EKS IRSA).
  # Used by both API/web pods (for K8s API access) and agent pods (for cloud service auth).
  # Example for GKE Workload Identity:
  #   iam.gke.io/gcp-service-account: optio@PROJECT_ID.iam.gserviceaccount.com
  # Example for EKS IRSA (lets CodeCommit use the pod's IAM role instead of static AWS keys):
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/optio-codecommit
  annotations: {}

# ──────────────────────────────────────────────────────────────────────────────
# Image pull secrets for pulling from private registries.
# Each entry should be the name of an existing Kubernetes secret of type
# kubernetes.io/dockerconfigjson in the target namespace.
# ──────────────────────────────────────────────────────────────────────────────
imagePullSecrets: []
#  - name: my-registry-secret
