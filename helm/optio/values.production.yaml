# Optio Helm Chart — Recommended Production Values
#
# Create optio-runtime using your secret manager (External Secrets Operator,
# Secrets Store CSI sync, or kubectl). See docs/production-eks.md.
# helm upgrade --install optio oci://ghcr.io/jonwiggins/optio --version <release> \
#   -n optio --create-namespace -f values.production.yaml
# Pin one release for the chart and images. Back up Postgres and the encryption key.

publicUrl: https://optio.example.com

existingSecrets:
  DATABASE_URL: { name: optio-runtime, key: database-url }
  REDIS_URL: { name: optio-runtime, key: redis-url }
  OPTIO_ENCRYPTION_KEY: { name: optio-runtime, key: encryption-key }
  # Or configure organization Google sign-in in the bootstrap wizard.
  # GOOGLE_OAUTH_CLIENT_ID: { name: optio-runtime, key: google-client-id }
  # GOOGLE_OAUTH_CLIENT_SECRET: { name: optio-runtime, key: google-client-secret }
  # OpenID Connect or LDAP from your secret manager instead (docs/sign-in.md),
  # with the rest under auth.oidc / auth.ldap:
  # OIDC_ISSUER_URL: { name: optio-runtime, key: oidc-issuer-url }
  # OIDC_CLIENT_ID: { name: optio-runtime, key: oidc-client-id }
  # OIDC_CLIENT_SECRET: { name: optio-runtime, key: oidc-client-secret }
  # LDAP_BIND_PASSWORD: { name: optio-runtime, key: ldap-bind-password }

# --- API Server ---
# Images default to GHCR in values.yaml — no image overrides needed here.
api:
  # Raise for availability: any number of API/web pods share the database
  # and Redis. Caches and the per-address WebSocket cap are per pod
  # (docs/production-eks.md).
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  # API and web share one pod. Rollouts are Recreate (migrations at boot).
  strategy:
    type: Recreate
  pdb:
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: false

# --- Web UI ---
web:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
# --- Agent containers ---
# Images and pull policies default to GHCR / IfNotPresent in values.yaml.

# --- Agent pod isolation ---
networkPolicy:
  enabled: true

# --- Use external managed database and Redis ---
postgresql:
  enabled: false
redis:
  enabled: false
# --- Authentication (required for production) ---
auth:
  disabled: false
  # Configure OAuth using existingSecrets above or the Google bootstrap wizard.
  # OpenID Connect (auth.oidc.*) and LDAP / Active Directory (auth.ldap.*) are
  # options too, here or in the setup wizard.

# --- Ingress with TLS ---
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
  certManager:
    enabled: true
    clusterIssuer: letsencrypt-prod
  hosts:
    - host: optio.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
        - path: /ws
          pathType: Prefix
          service: api

# --- Resource quotas to limit agent resource consumption ---
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    pods: "50"
    persistentvolumeclaims: "30"
