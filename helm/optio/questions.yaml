# Optional Rancher install form. Edit YAML exposes the remaining chart values.
# rancherForm.signIn controls field visibility only.
questions:
  - variable: createNamespace
    label: Create the namespace
    description: Disable when Rancher or another installer creates the namespace.
    type: boolean
    default: true
    group: Access
  - variable: publicUrl
    label: Public URL
    description: The address people open Optio at, e.g. https://optio.example.com. Sign-in sends people back here, and GitLab delivers webhooks here, so GitLab must be able to reach it too.
    type: string
    required: true
    group: Access
  - variable: ingress.enabled
    label: Serve Optio through the cluster's ingress
    description: RKE2 and K3s clusters that Rancher manages run an ingress controller (ingress-nginx on RKE2). Turn this on unless you expose Optio some other way.
    type: boolean
    group: Access
  - variable: ingress.hosts.0.host
    label: Hostname
    description: The hostname in the public URL, e.g. optio.example.com (replace values.yaml's optio.example.com). Point it at the ingress controller in your DNS.
    type: hostname
    required: true
    show_if: ingress.enabled=true
    group: Access
  - variable: ingress.className
    label: Ingress class
    description: The IngressClass of your controller. RKE2's ingress-nginx is "nginx"; K3s ships Traefik ("traefik").
    type: string
    default: nginx
    show_if: ingress.enabled=true
    group: Access
  - variable: ingress.tls.0.secretName
    label: TLS secret
    description: A kubernetes.io/tls Secret in Optio's namespace with the certificate for the hostname (Storage → Secrets → Create → TLS Certificate). Leave it empty to serve the controller's default certificate.
    type: string
    show_if: ingress.enabled=true
    group: Access
  - variable: ingress.tls.0.hosts
    label: Hostnames the certificate is for
    description: The same hostname as above. Needed only with a TLS secret.
    type: array[string]
    show_if: ingress.enabled=true
    group: Access
  - variable: encryption.key
    label: Encryption key
    description: Encrypts the secrets Optio keeps in its database. 64 hex characters (openssl rand -hex 32). Write it down and keep it the same on every upgrade; a different key makes every stored secret unreadable.
    type: password
    required: true
    group: Keys
  - variable: postgresql.auth.password
    label: Database password
    description: The password of the PostgreSQL that comes with the chart. Keep it the same on every upgrade.
    type: password
    required: true
    group: Keys

  - variable: rancherForm.signIn
    label: How people sign in
    description: Choose GitHub, GitLab, Google or OIDC settings here, or leave configuration to the setup wizard. A provider saved in the application takes precedence over chart settings.
    type: enum
    options:
      - github
      - gitlab
      - google
      - oidc
      - wizard
    default: wizard
    group: Sign-in
  - variable: auth.github.clientId
    label: GitHub OAuth client ID
    type: string
    show_if: rancherForm.signIn=github
    group: Sign-in
  - variable: auth.github.clientSecret
    label: GitHub OAuth client secret
    type: password
    show_if: rancherForm.signIn=github
    group: Sign-in
  - variable: auth.gitlab.clientId
    label: GitLab OAuth client ID
    type: string
    show_if: rancherForm.signIn=gitlab
    group: Sign-in
  - variable: auth.gitlab.clientSecret
    label: GitLab OAuth client secret
    type: password
    show_if: rancherForm.signIn=gitlab
    group: Sign-in
  - variable: auth.google.clientId
    label: Google OAuth client ID
    type: string
    show_if: rancherForm.signIn=google
    group: Sign-in
  - variable: auth.google.clientSecret
    label: Google OAuth client secret
    type: password
    show_if: rancherForm.signIn=google
    group: Sign-in
  - variable: auth.setupToken
    label: Setup token
    description: The one-time token that unlocks the setup wizard while nobody can sign in yet. Leave it empty and Optio makes one and writes it to its log (kubectl logs -n optio deploy/optio-api -c api | grep "setup token").
    type: password
    group: Sign-in
  - variable: auth.deploymentAdmins
    label: Deployment admins
    description: E-mail addresses of the people who may change how everyone signs in, one per row, e.g. admins@example.com. They must sign in once.
    type: array[string]
    group: Sign-in
  - variable: auth.oidc.issuerUrl
    label: OIDC issuer URL
    description: Your identity provider (for example Authentik, GitLab or Keycloak), e.g. https://sso.example.com/realms/main. Register the redirect URI <public URL>/api/auth/oidc/callback with it.
    type: string
    required: true
    show_if: rancherForm.signIn=oidc
    group: Sign-in
  - variable: auth.oidc.clientId
    label: OIDC client ID
    type: string
    required: true
    show_if: rancherForm.signIn=oidc
    group: Sign-in
  - variable: auth.oidc.clientSecret
    label: OIDC client secret
    type: password
    show_if: rancherForm.signIn=oidc
    group: Sign-in
  - variable: auth.oidc.displayName
    label: Sign-in button label
    description: The button reads "Sign in with <this>".
    type: string
    default: SSO
    show_if: rancherForm.signIn=oidc
    group: Sign-in
  - variable: auth.oidc.scopes
    label: Scopes
    description: 'What Optio asks the provider for, separated by spaces. Empty means "openid profile email". Some providers send groups only for an extra scope: Okta and Authelia need "openid profile email groups", ADFS "openid profile email allatclaims".'
    type: string
    show_if: rancherForm.signIn=oidc
    group: Sign-in
  - variable: webhook.gitlabSecret
    label: Webhook secret (optional)
    description: Optio creates each project's webhook itself, with a secret it makes. Set this only for webhooks you add by hand in GitLab (their "Secret token").
    type: password
    group: GitLab
  - variable: outbound.allowedHosts
    label: Allowed private hosts
    description: 'Optio refuses to call private addresses unless they are listed here, and with a private registry everything is a private address. List the domains of the services Optio must call, one per row: GitLab, Jira, the model gateway, Coder, your webhook targets. Most networks need one entry, e.g. *.example.com. Names, *.suffix, IPs and CIDRs work. Leave it empty only if you turn on the switch below.'
    type: array[string]
    group: Network
  - variable: outbound.allowPrivate
    label: Allow every private address
    description: The blunt alternative to the list above. Optio may then call anything in 10.x, 172.16-31.x and 192.168.x, other services in the cluster included. Loopback and cloud metadata addresses stay blocked.
    type: boolean
    default: false
    group: Network
  - variable: api.image.repository
    label: API image
    description: The package's is optio.local/optio-api.
    type: string
    group: Images
  - variable: api.image.tag
    label: API image tag
    description: Choose the image version published in your registry.
    type: string
    group: Images
  - variable: web.image.repository
    label: Web image
    description: The package's is optio.local/optio-web.
    type: string
    group: Images
  - variable: web.image.tag
    label: Web image tag
    description: Choose the image version published in your registry.
    type: string
    group: Images
  - variable: agent.image.repository
    label: Agent image
    description: The package's is optio.local/optio-agent-base.
    type: string
    group: Images
  - variable: agent.image.prefix
    label: Agent preset image prefix
    description: Presets resolve to <prefix><preset>:<agent tag>. The package's is optio.local/optio-agent-.
    type: string
    group: Images
  - variable: agent.image.tag
    label: Agent image tag
    description: Choose the image version published in your registry.
    type: string
    group: Images
  - variable: postgresql.image.tag
    label: PostgreSQL image tag
    description: The package's is 16.15.
    type: string
    group: Images
  - variable: redis.image.tag
    label: Redis image tag
    description: The package's is 7.4.11-alpine.
    type: string
    group: Images
  - variable: agent.envoyProxy.image.tag
    label: Envoy image tag
    description: The package's is v1.31.10.
    type: string
    group: Images

  - variable: postgresql.storage.storageClass
    label: Database storage class
    description: Empty means the cluster's default storage class.
    type: storageclass
    group: Storage
  - variable: postgresql.storage.size
    label: Database size
    type: string
    default: 5Gi
    group: Storage
  - variable: agent.pvc.storageClass
    label: Agent home volume storage class
    description: Each repository's agent pod gets a volume. Empty means the default storage class.
    type: storageclass
    group: Storage
  - variable: agent.pvc.size
    label: Agent home volume size
    type: string
    default: 10Gi
    group: Storage
  - variable: agent.cache.storageClass
    label: Agent cache storage class
    description: For the shared cache volumes a repository turns on. Empty means the default storage class.
    type: storageclass
    group: Storage

  - variable: agentPolicy.builtInRules
    label: Built-in agent deny rules
    description: Write the built-in deny rules (secrets in the checkout, force pushes, curl | sh) into every agent run's Claude Code managed settings, in every workspace (docs/agent-policy.md). Off by default.
    type: boolean
    default: false
    group: Advanced
  - variable: agent.runtimeClassName
    label: Agent RuntimeClass
    description: The Kubernetes RuntimeClass every agent pod runs under, such as gvisor or kata. It must exist in the cluster. Empty means the cluster's default runtime.
    type: string
    default: ""
    group: Advanced
  - variable: namespace
    label: Namespace
    description: Must be the namespace you install into above; Optio's objects go here.
    type: string
    default: optio
    group: Advanced
  - variable: api.replicas
    label: API replicas
    description: API and web pods. More than one share the database and Redis.
    type: int
    default: 1
    min: 1
    max: 10
    group: Advanced
  - variable: api.resources.requests.cpu
    label: API CPU request
    type: string
    default: 250m
    group: Advanced
  - variable: api.resources.requests.memory
    label: API memory request
    type: string
    default: 512Mi
    group: Advanced
  - variable: api.resources.limits.cpu
    label: API CPU limit
    type: string
    default: "1"
    group: Advanced
  - variable: api.resources.limits.memory
    label: API memory limit
    type: string
    default: 1Gi
    group: Advanced
  - variable: web.resources.requests.cpu
    label: Web CPU request
    description: The web UI runs next to the API, in the same pod.
    type: string
    default: 100m
    group: Advanced
  - variable: web.resources.requests.memory
    label: Web memory request
    type: string
    default: 256Mi
    group: Advanced
  - variable: web.resources.limits.cpu
    label: Web CPU limit
    type: string
    default: 500m
    group: Advanced
  - variable: web.resources.limits.memory
    label: Web memory limit
    type: string
    default: 512Mi
    group: Advanced
