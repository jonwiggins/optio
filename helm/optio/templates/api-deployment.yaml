apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Values.namespace }}
  labels:
    app: optio-api
    {{- include "optio.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  # Migrations run at boot: no old and new version serve side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: optio-api
  template:
    metadata:
      labels:
        app: optio-api
      annotations:
        # Roll the pods when the config secret (auth values among it) changes.
        checksum/config: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- if include "optio.caBundleConfigMap" . }}
        checksum/ca-bundle: {{ include (print $.Template.BasePath "/ca-bundle.yaml") . | sha256sum }}
        {{- end }}
        {{- if or .Values.agent.env .Values.gitlab.hosts }}
        checksum/agent-env: {{ include (print $.Template.BasePath "/agent-env.yaml") . | sha256sum }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.api.antiAffinity "hard" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: optio-api
              topologyKey: kubernetes.io/hostname
      {{- else if eq .Values.api.antiAffinity "soft" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: optio-api
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- if include "optio.caBundleConfigMap" . }}
      initContainers:
        # Your CA bundle appended to the image's own, for git (skill sync)
        # and anything else that reads a whole bundle; Node itself adds
        # ca.crt to its roots (NODE_EXTRA_CA_CERTS).
        - name: ca-bundle
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command: ["sh", "-c"]
          args:
            - cat /etc/ssl/certs/ca-certificates.crt /src/ca.crt > /etc/optio-ca/bundle.crt && cp /src/ca.crt /etc/optio-ca/ca.crt
          volumeMounts:
            - name: ca-bundle-source
              mountPath: /src
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/optio-ca
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: {{ .Values.api.port }}
            {{- if .Values.metrics.enabled }}
            # the Prometheus endpoint, its own port (templates/metrics-service.yaml).
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The agent home of the work that runs in this pod (the assistant,
            # optio.assistant.placement): run homes, setup files, harness config.
            - name: agent-home
              mountPath: /home/agent
            {{- if and .Values.configAsCode.enabled (or .Values.configAsCode.configMap .Values.configAsCode.files) }}
            - name: config-manifests
              mountPath: {{ .Values.configAsCode.mountPath | default "/etc/optio-config" }}
              readOnly: true
            {{- end }}
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if and .Values.postgresql.enabled .Values.postgresql.tls.enabled }}
            - name: pg-ca
              mountPath: /etc/optio
              readOnly: true
            {{- end }}
            {{- if and .Values.redis.enabled .Values.redis.tls.enabled }}
            - name: redis-tls-ca
              mountPath: /etc/redis-tls
              readOnly: true
            {{- end }}
            {{- if include "optio.caBundleConfigMap" . }}
            - name: ca-bundle
              mountPath: /etc/optio-ca
              readOnly: true
            {{- end }}
          envFrom:
            {{- if or .Values.agent.env .Values.gitlab.hosts }}
            # The agent environment (package mirrors, the model gateway) for
            # the work that runs in this pod (optio.assistant.placement:
            # api-pod), so an MCP server's npx/uvx finds the mirror here too.
            # First, so the release's own config wins on a shared name.
            - configMapRef:
                name: {{ .Release.Name }}-agent-env
                optional: true
            {{- end }}
            - secretRef:
                name: {{ .Release.Name }}-config
            {{- if .Values.github.app.existingSecret }}
            - secretRef:
                name: {{ .Values.github.app.existingSecret }}
            {{- end }}
            {{- if .Values.notifications.apns.existingSecret }}
            - secretRef:
                name: {{ .Values.notifications.apns.existingSecret }}
            {{- end }}
            {{- if .Values.notifications.fcm.existingSecret }}
            - secretRef:
                name: {{ .Values.notifications.fcm.existingSecret }}
            {{- end }}
          env:
            {{- range $env, $ref := .Values.existingSecrets }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ required (printf "existingSecrets.%s.name is required" $env) $ref.name | quote }}
                  key: {{ required (printf "existingSecrets.%s.key is required" $env) $ref.key | quote }}
            {{- end }}
            - name: OPTIO_AGENT_SERVICE_ACCOUNT_NAME
              value: {{ dig "serviceAccount" "name" "" .Values.agent | default (printf "%s-agent" .Release.Name) | quote }}
            {{- if .Values.metrics.enabled }}
            # Prometheus metrics on their own port (docs/observability.md "Monitoring").
            - name: OPTIO_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- end }}
            - name: OPTIO_HOME_PVC_STORAGE_CLASS
              value: {{ .Values.agent.pvc.storageClass | quote }}
            - name: OPTIO_HOME_PVC_SIZE
              value: {{ .Values.agent.pvc.size | quote }}
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
            - name: API_HOST
              value: "0.0.0.0"
            - name: OPTIO_API_INTERNAL_URL
              value: "http://{{ .Release.Name }}-api:{{ .Values.api.port }}"
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: {{ .Values.api.env.LOG_LEVEL | quote }}
            - name: OPTIO_ENVOY_IMAGE
              value: "{{ .Values.agent.envoyProxy.image.repository }}:{{ .Values.agent.envoyProxy.image.tag }}"
            {{- if and .Values.redis.enabled .Values.redis.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis-auth
                  key: REDIS_PASSWORD
            {{- end }}
            - name: OPTIO_STATEFULSET_ENABLED
              value: {{ .Values.agent.statefulSet.enabled | quote }}
            - name: OPTIO_ROOTLESS
              value: {{ .Values.agent.rootless | default false | quote }}
            - name: OPTIO_TERMINATION_GRACE_PERIOD_SECONDS
              value: {{ .Values.agent.statefulSet.terminationGracePeriodSeconds | quote }}
            - name: OPTIO_SERVICE_ACCOUNT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            # Which API pod this is (services/instance.ts): the holder of
            # leases and the instance a run is attached to.
            - name: OPTIO_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The namespace this release runs in: where agent pods, their
            # StatefulSets and PVCs go, and what the cluster page reads.
            - name: OPTIO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if include "optio.caBundleConfigMap" . }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/optio-ca/ca.crt
            - name: GIT_SSL_CAINFO
              value: /etc/optio-ca/bundle.crt
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # Database migrations run at boot, before the server listens. The
          # startup probe holds off liveness until /api/health first answers,
          # so a long migration isn't killed half-way and retried in a loop.
          startupProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            periodSeconds: 10
            # dig: an upgrade with --reuse-values keeps release values that predate this key.
            failureThreshold: {{ dig "startupProbe" "failureThreshold" 60 .Values.api }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
        # The web UI shares the API's pod: one rollout, one pod to schedule,
        # and the Next server reaches the API over localhost.
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: {{ .Values.web.port }}
          volumeMounts:
            - name: web-tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          env:
            - name: INTERNAL_API_URL
              value: "http://127.0.0.1:{{ .Values.api.port }}"
            - name: OPTIO_AUTH_DISABLED
              value: {{ .Values.auth.disabled | quote }}
            {{- range $name, $value := (include "optio.featureSettings" . | fromYaml) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.publicUrl }}
            - name: PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            {{- end }}
            {{- if .Values.web.publicApiUrl }}
            - name: PUBLIC_API_URL
              value: {{ .Values.web.publicApiUrl | quote }}
            {{- else if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
            - name: PUBLIC_API_URL
              value: "http://localhost:{{ .Values.api.service.nodePort }}"
            {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: agent-home
          emptyDir: {}
        {{- with include "optio.caBundleConfigMap" . }}
        - name: ca-bundle-source
          configMap:
            name: {{ . }}
            items:
              - key: {{ $.Values.caBundle.key }}
                path: ca.crt
        - name: ca-bundle
          emptyDir: {}
        {{- end }}
        - name: web-tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        {{- if and .Values.configAsCode.enabled (or .Values.configAsCode.configMap .Values.configAsCode.files) }}
        - name: config-manifests
          configMap:
            name: {{ .Values.configAsCode.configMap | default (printf "%s-config-manifests" .Release.Name) }}
        {{- end }}
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and .Values.postgresql.enabled .Values.postgresql.tls.enabled }}
        - name: pg-ca
          secret:
            secretName: {{ .Release.Name }}-postgres-tls
            items:
              - key: ca.crt
                path: pg-ca.crt
        {{- end }}
        {{- if and .Values.redis.enabled .Values.redis.tls.enabled }}
        - name: redis-tls-ca
          secret:
            {{- if and .Values.redis.tls.existingSecret (not .Values.redis.tls.autoGenerateCert) }}
            secretName: {{ .Values.redis.tls.existingSecret }}
            {{- else }}
            secretName: {{ .Release.Name }}-redis-tls
            {{- end }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Values.namespace }}
  labels:
    app: optio-api
    {{- include "optio.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: optio-api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      appProtocol: kubernetes.io/ws  # WebSocket support for /ws/* endpoints
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
