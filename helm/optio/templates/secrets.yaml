{{- if and .Values.postgresql.enabled (not .Values.auth.disabled) (not .Values.postgresql.auth.password) }}
  {{- fail "postgresql.auth.password is required when auth is enabled. Set a strong password for production use." }}
{{- end }}
{{- include "optio.validateRequired" . }}
{{- include "optio.validateEncryptionKey" . }}
{{- $previous := (lookup "v1" "Secret" .Values.namespace (printf "%s-config" .Release.Name)).data | default dict }}
{{- $external := .Values.existingSecrets | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "optio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not (hasKey $external "DATABASE_URL") }}
  DATABASE_URL: {{ include "optio.databaseUrl" . | quote }}
  {{- end }}
  {{- if not (hasKey $external "REDIS_URL") }}
  REDIS_URL: {{ include "optio.redisUrl" . | quote }}
  {{- end }}
  {{- if and .Values.redis.enabled .Values.redis.tls.enabled }}
  REDIS_CA_CERT_PATH: "/etc/redis-tls/ca.crt"
  {{- end }}
  {{- /* Built-in Redis is one server; the mode only applies to externalRedis.
         (`default`s: an upgrade with --reuse-values keeps older values.) */ -}}
  {{- $redisMode := ternary "standalone" (.Values.externalRedis.mode | default "standalone") .Values.redis.enabled }}
  REDIS_MODE: {{ $redisMode | quote }}
  {{- with .Values.externalRedis.queuePrefix }}
  OPTIO_QUEUE_PREFIX: {{ . | quote }}
  {{- else }}
  # An explicit empty value: a key dropped from stringData lingers in the
  # Secret's data, which would keep a once-set prefix on.
  OPTIO_QUEUE_PREFIX: ""
  {{- end }}
  {{- if not (hasKey $external "OPTIO_ENCRYPTION_KEY") }}
  OPTIO_ENCRYPTION_KEY: {{ required "encryption.key is required" .Values.encryption.key | quote }}
  {{- end }}
  OPTIO_AGENT_IMAGE: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
  OPTIO_AGENT_IMAGE_PREFIX: {{ .Values.agent.image.prefix | quote }}
  OPTIO_AGENT_IMAGE_TAG: {{ .Values.agent.image.tag | quote }}
  OPTIO_IMAGE_PULL_POLICY: {{ .Values.agent.imagePullPolicy | quote }}
  {{- /* Explicit empty values, like OPTIO_QUEUE_PREFIX: a key dropped from
         stringData lingers in the Secret's data. */}}
  {{- if or .Values.agent.presets (hasKey $previous "OPTIO_AGENT_PRESETS") }}
  OPTIO_AGENT_PRESETS: {{ join "," (.Values.agent.presets | default list) | quote }}
  {{- end }}
  {{- if .Values.agent.recoveryPodRetentionMs }}
  {{- if or .Values.agent.recoveryPodRetentionMs (hasKey $previous "OPTIO_RECOVERY_POD_RETENTION_MS") }}
  OPTIO_RECOVERY_POD_RETENTION_MS: {{ .Values.agent.recoveryPodRetentionMs | int64 | quote }}
  {{- end }}
  {{- else }}
  {{- if or .Values.agent.recoveryPodRetentionMs (hasKey $previous "OPTIO_RECOVERY_POD_RETENTION_MS") }}
  OPTIO_RECOVERY_POD_RETENTION_MS: ""
  {{- end }}
  {{- end }}
  OPTIO_RUNTIME: "kubernetes"
  {{- with include "optio.featureSettings" . | trim }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- /* Who agents commit as (agent.git); explicit empty values, like
         OPTIO_AGENT_PRESETS, so a once-set identity doesn't linger. */}}
  {{- $git := .Values.agent.git | default dict }}
  {{- if or $git.botName (hasKey $previous "GIT_BOT_NAME") }}
  GIT_BOT_NAME: {{ $git.botName | default "" | quote }}
  {{- end }}
  {{- if or $git.botEmail (hasKey $previous "GIT_BOT_EMAIL") }}
  GIT_BOT_EMAIL: {{ $git.botEmail | default "" | quote }}
  {{- end }}
  OPTIO_AUTH_DISABLED: {{ .Values.auth.disabled | quote }}
  {{- if .Values.publicUrl }}
  PUBLIC_URL: {{ .Values.publicUrl | quote }}
  {{- end }}
  {{- /* Only an explicit value: the web's NodePort fallback (localhost) must
         never become the API's OAuth callback origin. */}}
  {{- if .Values.web.publicApiUrl }}
  PUBLIC_API_URL: {{ .Values.web.publicApiUrl | quote }}
  {{- end }}
  {{- if .Values.auth.setupToken }}
  {{- if not (hasKey $external "OPTIO_SETUP_TOKEN") }}
  OPTIO_SETUP_TOKEN: {{ .Values.auth.setupToken | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.auth.deploymentAdmins }}
  OPTIO_DEPLOYMENT_ADMINS: {{ join "," .Values.auth.deploymentAdmins | quote }}
  {{- end }}
  {{- /* The work-visibility mode of a workspace that hasn't picked one
         (docs/teams.md). `default`: --reuse-values keeps older values. */}}
  {{- if or (ne (.Values.workspaces.workVisibility | default "organization") "organization") (hasKey $previous "OPTIO_WORK_VISIBILITY_DEFAULT") }}
  OPTIO_WORK_VISIBILITY_DEFAULT: {{ ((.Values.workspaces | default dict).workVisibility) | default "organization" | quote }}
  {{- end }}
  {{- /* The organization workspace's name, when the first sign-in creates it
         (empty = "Organization"). Always rendered: a key dropped from
         stringData lingers in the Secret. */}}
  {{- if or .Values.workspaces.organizationName (hasKey $previous "OPTIO_ORGANIZATION_NAME") }}
  OPTIO_ORGANIZATION_NAME: {{ ((.Values.workspaces | default dict).organizationName) | default "" | quote }}
  {{- end }}
  {{- /* Who may create a workspace: admins (deployment admins) or everyone. */}}
  {{- if or (ne (.Values.workspaces.creation | default "everyone") "everyone") (hasKey $previous "OPTIO_WORKSPACE_CREATION") }}
  OPTIO_WORKSPACE_CREATION: {{ ((.Values.workspaces | default dict).creation) | default "everyone" | quote }}
  {{- end }}
  {{- /* Starter prompts at the first boot, teams, the automatic-merge
         confirmation and the getting-started guide: only an explicit true
         turns them on (unset = off). */}}
  {{- $starters := eq (toString (dig "starters" false (.Values.prompts | default dict))) "true" }}
  {{- if or $starters (hasKey $previous "OPTIO_STARTER_PROMPTS") }}
  OPTIO_STARTER_PROMPTS: {{ ternary "true" "false" $starters | quote }}
  {{- end }}
  {{- $teamsOn := eq (toString (dig "enabled" false (.Values.teams | default dict))) "true" }}
  {{- if or $teamsOn (hasKey $previous "OPTIO_TEAMS_ENABLED") }}
  OPTIO_TEAMS_ENABLED: {{ ternary "true" "false" $teamsOn | quote }}
  {{- end }}
  {{- $mergeConfirm := eq (toString (dig "confirmation" false (.Values.merge | default dict))) "true" }}
  {{- if or $mergeConfirm (hasKey $previous "OPTIO_MERGE_CONFIRMATION") }}
  OPTIO_MERGE_CONFIRMATION: {{ ternary "true" "false" $mergeConfirm | quote }}
  {{- end }}
  {{- $onboarding := eq (toString (dig "enabled" false (.Values.onboarding | default dict))) "true" }}
  {{- if or $onboarding (hasKey $previous "OPTIO_ONBOARDING") }}
  OPTIO_ONBOARDING: {{ ternary "true" "false" $onboarding | quote }}
  {{- end }}
  {{- if .Values.configAsCode.enabled }}
  # Config as code: the mounted manifest directory (docs/config-as-code.md).
  # (`default`s: an upgrade with --reuse-values doesn't pick up new chart defaults.)
  OPTIO_CONFIG_DIR: {{ .Values.configAsCode.mountPath | default "/etc/optio-config" | quote }}
  {{- if .Values.configAsCode.workspace }}
  OPTIO_CONFIG_WORKSPACE: {{ .Values.configAsCode.workspace | quote }}
  {{- end }}
  OPTIO_CONFIG_PRUNE: {{ .Values.configAsCode.prune | quote }}
  OPTIO_CONFIG_INTERVAL: {{ .Values.configAsCode.intervalMs | default 60000 | quote }}
  {{- else }}
  # Off. An explicit empty value: a key dropped from stringData lingers in the
  # Secret's data, which would keep a once-enabled directory on.
  OPTIO_CONFIG_DIR: ""
  {{- end }}
  {{- if .Values.auth.github.clientId }}
  {{- if not (hasKey $external "GITHUB_OAUTH_CLIENT_ID") }}
  GITHUB_OAUTH_CLIENT_ID: {{ .Values.auth.github.clientId | quote }}
  {{- end }}
  {{- if not (hasKey $external "GITHUB_OAUTH_CLIENT_SECRET") }}
  GITHUB_OAUTH_CLIENT_SECRET: {{ .Values.auth.github.clientSecret | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.auth.google.clientId }}
  {{- if not (hasKey $external "GOOGLE_OAUTH_CLIENT_ID") }}
  GOOGLE_OAUTH_CLIENT_ID: {{ .Values.auth.google.clientId | quote }}
  {{- end }}
  {{- if not (hasKey $external "GOOGLE_OAUTH_CLIENT_SECRET") }}
  GOOGLE_OAUTH_CLIENT_SECRET: {{ .Values.auth.google.clientSecret | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.auth.gitlab.clientId }}
  {{- if not (hasKey $external "GITLAB_OAUTH_CLIENT_ID") }}
  GITLAB_OAUTH_CLIENT_ID: {{ .Values.auth.gitlab.clientId | quote }}
  {{- end }}
  {{- if not (hasKey $external "GITLAB_OAUTH_CLIENT_SECRET") }}
  GITLAB_OAUTH_CLIENT_SECRET: {{ .Values.auth.gitlab.clientSecret | quote }}
  {{- end }}
  {{- if eq (toString .Values.auth.gitlab.storeUserToken) "true" }}
  GITLAB_OAUTH_STORE_USER_TOKEN: "true"
  {{- end }}
  {{- end }}
  {{- /* Sign-in (docs/sign-in.md): OpenID Connect and LDAP, as the API's
         envConfig() reads them. A provider saved in the app wins over these.
         Group lists go comma-separated (the API splits them). */}}
  {{- if and .Values.auth.linkAccountsByEmail (not (hasKey $external "OPTIO_LINK_ACCOUNTS_BY_EMAIL")) }}
  OPTIO_LINK_ACCOUNTS_BY_EMAIL: "true"
  {{- end }}
  {{- $oidc := .Values.auth.oidc | default dict }}
  {{- if $oidc.issuerUrl }}
  {{- if not (hasKey $external "OIDC_ISSUER_URL") }}
  OIDC_ISSUER_URL: {{ $oidc.issuerUrl | quote }}
  {{- end }}
  {{- if not (hasKey $external "OIDC_CLIENT_ID") }}
  OIDC_CLIENT_ID: {{ $oidc.clientId | quote }}
  {{- end }}
  {{- if not (hasKey $external "OIDC_CLIENT_SECRET") }}
  OIDC_CLIENT_SECRET: {{ $oidc.clientSecret | quote }}
  {{- end }}
  {{- if $oidc.displayName }}
  {{- if not (hasKey $external "OIDC_DISPLAY_NAME") }}
  OIDC_DISPLAY_NAME: {{ $oidc.displayName | quote }}
  {{- end }}
  {{- end }}
  {{- if $oidc.scopes }}
  {{- if not (hasKey $external "OIDC_SCOPES") }}
  OIDC_SCOPES: {{ $oidc.scopes | quote }}
  {{- end }}
  {{- end }}
  {{- if $oidc.groupsClaim }}
  OIDC_GROUPS_CLAIM: {{ $oidc.groupsClaim | quote }}
  {{- end }}
  {{- /* Explicit empty values: a key dropped from stringData lingers in the
         Secret, which would keep a once-set group list on. */}}
  OIDC_ADMIN_GROUPS: {{ join "," ($oidc.adminGroups | default list) | quote }}
  OIDC_REQUIRED_GROUPS: {{ join "," ($oidc.requiredGroups | default list) | quote }}
  {{- /* Only an explicit true turns these on (unset = the API's default, false). */}}
  OIDC_TRUST_EMAIL: {{ ternary "true" "false" (eq (toString $oidc.trustEmail) "true") | quote }}
  OIDC_USE_PKCE: {{ ternary "true" "false" (eq (toString $oidc.usePkce) "true") | quote }}
  OIDC_AUTO_JOIN_ORGANIZATION: {{ ternary "true" "false" (eq (toString $oidc.autoJoinOrganization) "true") | quote }}
  OIDC_LINK_BY_EMAIL: {{ ternary "true" "false" (eq (toString $oidc.linkByEmail) "true") | quote }}
  {{- if $oidc.caPem }}
  OIDC_CA_PEM: {{ $oidc.caPem | quote }}
  {{- end }}
  {{- end }}
  {{- $ldap := .Values.auth.ldap | default dict }}
  {{- if $ldap.url }}
  LDAP_URL: {{ $ldap.url | quote }}
  LDAP_START_TLS: {{ ternary "true" "false" (eq (toString $ldap.startTls) "true") | quote }}
  {{- if $ldap.bindDn }}
  LDAP_BIND_DN: {{ $ldap.bindDn | quote }}
  {{- if not (hasKey $external "LDAP_BIND_PASSWORD") }}
  LDAP_BIND_PASSWORD: {{ $ldap.bindPassword | quote }}
  {{- end }}
  {{- end }}
  LDAP_USER_BASE_DN: {{ required "auth.ldap.userBaseDn is required with auth.ldap.url (where users live, e.g. OU=People,DC=example,DC=com)" $ldap.userBaseDn | quote }}
  {{- with $ldap.userFilter }}
  LDAP_USER_FILTER: {{ . | quote }}
  {{- end }}
  {{- with $ldap.usernameAttribute }}
  LDAP_USERNAME_ATTRIBUTE: {{ . | quote }}
  {{- end }}
  {{- with $ldap.emailAttribute }}
  LDAP_EMAIL_ATTRIBUTE: {{ . | quote }}
  {{- end }}
  {{- with $ldap.displayNameAttribute }}
  LDAP_DISPLAY_NAME_ATTRIBUTE: {{ . | quote }}
  {{- end }}
  {{- with $ldap.groupMode }}
  LDAP_GROUP_MODE: {{ . | quote }}
  {{- end }}
  {{- with $ldap.groupBaseDn }}
  LDAP_GROUP_BASE_DN: {{ . | quote }}
  {{- end }}
  {{- with $ldap.groupFilter }}
  LDAP_GROUP_FILTER: {{ . | quote }}
  {{- end }}
  LDAP_ADMIN_GROUPS: {{ join "," ($ldap.adminGroups | default list) | quote }}
  LDAP_REQUIRED_GROUPS: {{ join "," ($ldap.requiredGroups | default list) | quote }}
  LDAP_LINK_BY_EMAIL: {{ ternary "true" "false" (eq (toString $ldap.linkByEmail) "true") | quote }}
  {{- with $ldap.displayName }}
  LDAP_DISPLAY_NAME: {{ . | quote }}
  {{- end }}
  {{- with $ldap.caPem }}
  LDAP_CA_PEM: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- /* the directory sync (docs/directory-sync.md), for LDAP sign-in
         set up here or in the app. Always rendered: a key dropped from
         stringData lingers in the Secret. */}}
  {{- $dirSync := .Values.auth.directorySync | default dict }}
  {{- if or $dirSync.enabled (hasKey $previous "OPTIO_DIRECTORY_SYNC") }}
  OPTIO_DIRECTORY_SYNC: {{ ternary "true" "false" (eq (toString $dirSync.enabled) "true") | quote }}
  {{- end }}
  {{- if or $dirSync.enabled (hasKey $previous "OPTIO_DIRECTORY_SYNC_INTERVAL_MINUTES") }}
  OPTIO_DIRECTORY_SYNC_INTERVAL_MINUTES: {{ $dirSync.intervalMinutes | default 30 | quote }}
  {{- end }}
  {{- if or $dirSync.enabled (hasKey $previous "OPTIO_DIRECTORY_SYNC_MAX_DISABLE_PERCENT") }}
  OPTIO_DIRECTORY_SYNC_MAX_DISABLE_PERCENT: {{ hasKey $dirSync "maxDisablePercent" | ternary $dirSync.maxDisablePercent 25 | quote }}
  {{- end }}
  {{- /* GitHub App IDs must be quoted strings in values.yaml to avoid YAML float truncation */ -}}
  {{- if and .Values.github.app.id (not .Values.github.app.existingSecret) }}
  GITHUB_APP_ID: {{ .Values.github.app.id | toString | quote }}
  GITHUB_APP_CLIENT_ID: {{ .Values.github.app.clientId | toString | quote }}
  GITHUB_APP_CLIENT_SECRET: {{ .Values.github.app.clientSecret | toString | quote }}
  GITHUB_APP_INSTALLATION_ID: {{ .Values.github.app.installationId | toString | quote }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.github.app.privateKey | toString | quote }}
  {{- if .Values.github.app.botName }}
  GITHUB_APP_BOT_NAME: {{ .Values.github.app.botName | quote }}
  {{- end }}
  {{- if .Values.github.app.botEmail }}
  GITHUB_APP_BOT_EMAIL: {{ .Values.github.app.botEmail | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.webhook.githubSecret }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.webhook.githubSecret | quote }}
  {{- end }}
  {{- if .Values.webhook.slackSigningSecret }}
  SLACK_SIGNING_SECRET: {{ .Values.webhook.slackSigningSecret | quote }}
  {{- end }}
  {{- if .Values.webhook.linearSecret }}
  LINEAR_WEBHOOK_SECRET: {{ .Values.webhook.linearSecret | quote }}
  {{- end }}
  {{- if .Values.webhook.pagerdutySecret }}
  PAGERDUTY_WEBHOOK_SECRET: {{ .Values.webhook.pagerdutySecret | quote }}
  {{- end }}
  {{- if .Values.webhook.gitlabSecret }}
  GITLAB_WEBHOOK_SECRET: {{ .Values.webhook.gitlabSecret | quote }}
  {{- end }}
  {{- if .Values.webhook.jiraSecret }}
  JIRA_WEBHOOK_SECRET: {{ .Values.webhook.jiraSecret | quote }}
  {{- end }}
  {{- if .Values.webhook.sentrySecret }}
  SENTRY_WEBHOOK_SECRET: {{ .Values.webhook.sentrySecret | quote }}
  {{- end }}
  {{- if .Values.credentialSecret }}
  OPTIO_CREDENTIAL_SECRET: {{ .Values.credentialSecret | quote }}
  {{- else if not (hasKey $external "OPTIO_ENCRYPTION_KEY") }}
  OPTIO_CREDENTIAL_SECRET: {{ printf "%s:credential-secret" .Values.encryption.key | sha256sum | quote }}
  {{- end }}
  # Agent pod scheduling
  {{- if .Values.agent.nodeSelector }}
  OPTIO_AGENT_NODE_SELECTOR: {{ .Values.agent.nodeSelector | toJson | quote }}
  {{- end }}
  {{- if .Values.agent.tolerations }}
  OPTIO_AGENT_TOLERATIONS: {{ .Values.agent.tolerations | toJson | quote }}
  {{- end }}
  {{- /* agent policy (docs/agent-policy.md). Explicit empty values, like
         OPTIO_AGENT_PRESETS, so a once-set class doesn't linger. */}}
  {{- if or .Values.agent.runtimeClassName (hasKey $previous "OPTIO_AGENT_RUNTIME_CLASS") }}
  OPTIO_AGENT_RUNTIME_CLASS: {{ .Values.agent.runtimeClassName | default "" | quote }}
  {{- end }}
  {{- if or .Values.agent.runtimeClasses (hasKey $previous "OPTIO_AGENT_RUNTIME_CLASSES") }}
  OPTIO_AGENT_RUNTIME_CLASSES: {{ join "," (.Values.agent.runtimeClasses | default list) | quote }}
  {{- end }}
  {{- if or .Values.networkPolicy.agentEgress (hasKey $previous "OPTIO_AGENT_EGRESS") }}
  OPTIO_AGENT_EGRESS: {{ dict "enforced" (.Values.networkPolicy.enabled | default false) "allow" (.Values.networkPolicy.agentEgress | default list) | toJson | quote }}
  {{- end }}
  # Cache directory PVC configuration
  OPTIO_CACHE_ENABLED: {{ .Values.agent.cache.enabled | quote }}
  OPTIO_CACHE_STORAGE_CLASS: {{ .Values.agent.cache.storageClass | quote }}
  OPTIO_CACHE_MAX_SIZE_PER_DIR_GI: {{ .Values.agent.cache.maxSizePerDirectoryGi | quote }}
  OPTIO_CACHE_MAX_SIZE_TOTAL_GI: {{ .Values.agent.cache.maxSizeTotalGi | quote }}
  OPTIO_CACHE_DEFAULT_SIZE_GI: {{ .Values.agent.cache.defaultSizePerDirectoryGi | quote }}
  # Repo init timeout
  OPTIO_REPO_INIT_TIMEOUT_MS: {{ .Values.agent.repoInitTimeoutMs | quote }}
  # Per-IP API rate limit (requests / minute)
  OPTIO_RATE_LIMIT_MAX: {{ .Values.rateLimit.maxPerMinute | quote }}
  # Proxies whose X-Forwarded-For the API believes (the ingress: one hop)
  {{- if or (or .Values.rateLimit.trustProxy .Values.ingress.enabled) (hasKey $previous "OPTIO_TRUST_PROXY") }}
  OPTIO_TRUST_PROXY: {{ .Values.rateLimit.trustProxy | default (ternary "1" "" .Values.ingress.enabled) | quote }}
  {{- end }}
  # The audit trail: retention in days, and a JSON line per entry on stdout (docs/audit.md)
  {{- if or (ne (int .Values.audit.retentionDays) 365) (hasKey $previous "OPTIO_AUDIT_RETENTION_DAYS") }}
  OPTIO_AUDIT_RETENTION_DAYS: {{ .Values.audit.retentionDays | default 365 | quote }}
  {{- end }}
  {{- if or .Values.audit.stdout (hasKey $previous "OPTIO_AUDIT_STDOUT") }}
  OPTIO_AUDIT_STDOUT: {{ .Values.audit.stdout | default "" | quote }}
  {{- end }}
  # Gateway keys Optio made in LiteLLM: how often each is checked (docs/model-gateway.md)
  {{- if or (ne (int .Values.gatewayKeys.checkMinutes) 10) (hasKey $previous "OPTIO_GATEWAY_KEY_CHECK_MINUTES") }}
  OPTIO_GATEWAY_KEY_CHECK_MINUTES: {{ (.Values.gatewayKeys | default dict).checkMinutes | default 10 | quote }}
  {{- end }}
  # The ticket round trip's follow-up limit, traceable MRs and the commits' trailers (docs/ticket-round-trip.md)
  {{- $tickets := .Values.tickets | default dict }}
  {{- /* Only an explicit true turns traceability on. */}}
  {{- $traceability := eq (toString (dig "traceability" false $tickets)) "true" }}
  {{- if or $traceability (hasKey $previous "OPTIO_WORK_TRACEABILITY") }}
  OPTIO_WORK_TRACEABILITY: {{ ternary "true" "false" $traceability | quote }}
  {{- end }}
  {{- /* Trailers: unset, the API's default (on, with traceability); rendered once set. */}}
  {{- if or (hasKey $tickets "commitTrailers") (hasKey $previous "OPTIO_COMMIT_TRAILERS") }}
  OPTIO_COMMIT_TRAILERS: {{ ternary "false" "true" (eq (toString (dig "commitTrailers" true $tickets)) "false") | quote }}
  {{- end }}
  {{- if or (ne (int $tickets.followUpLimit) 10) (hasKey $previous "OPTIO_TICKET_FOLLOW_UP_LIMIT") }}
  OPTIO_TICKET_FOLLOW_UP_LIMIT: {{ dig "followUpLimit" 10 $tickets | toString | quote }}
  {{- end }}
  # Credential health: minutes between passes (0 = off), and the gateway pre-flight (docs/credential-health.md)
  {{- $health := .Values.credentialHealth | default dict }}
  {{- if or (ne (int $health.intervalMinutes) 0) (hasKey $previous "OPTIO_CREDENTIAL_HEALTH_INTERVAL_MINUTES") }}
  OPTIO_CREDENTIAL_HEALTH_INTERVAL_MINUTES: {{ dig "intervalMinutes" 0 $health | toString | quote }}
  {{- end }}
  {{- /* Pre-flight: unset, the API's default (on); an explicit true or false is rendered. */}}
  {{- $preflight := toString (dig "gatewayPreflight" "" $health) }}
  {{- if or (has $preflight (list "true" "false")) (hasKey $previous "OPTIO_GATEWAY_PREFLIGHT") }}
  OPTIO_GATEWAY_PREFLIGHT: {{ ternary "false" "true" (eq $preflight "false") | quote }}
  {{- end }}
  # Outbound URL guard (SSRF): private ranges and always-allowed hosts
  OPTIO_OUTBOUND_ALLOW_PRIVATE: {{ .Values.outbound.allowPrivate | quote }}
  OPTIO_OUTBOUND_ALLOWED_HOSTS: {{ join "," .Values.outbound.allowedHosts | quote }}
  # Self-hosted GitLab hostnames (platform detection for repo URLs)
  {{- if or .Values.gitlab.hosts (hasKey $previous "GITLAB_HOSTS") }}
  GITLAB_HOSTS: {{ join "," .Values.gitlab.hosts | quote }}
  {{- end }}
  # TLS verification on the webhooks Optio registers on GitLab projects.
  # Only an explicit false turns it off (`default` would read false as unset).
  {{- if or (eq (toString .Values.gitlab.hookSslVerify) "false") (hasKey $previous "OPTIO_GITLAB_HOOK_SSL_VERIFY") }}
  OPTIO_GITLAB_HOOK_SSL_VERIFY: {{ ternary "false" "true" (eq (toString .Values.gitlab.hookSslVerify) "false") | quote }}
  {{- end }}
  # @-mentions of Optio's GitLab user in comments (docs/gitlab-bot.md)
  {{- $bot := .Values.gitlab.bot | default dict }}
  {{- if or $bot.enabled (hasKey $previous "OPTIO_GITLAB_BOT_ENABLED") }}
  OPTIO_GITLAB_BOT_ENABLED: {{ ternary "true" "false" (eq (toString (dig "enabled" false $bot)) "true") | quote }}
  {{- end }}
  {{- if or $bot.username (hasKey $previous "OPTIO_GITLAB_BOT_USERNAME") }}
  OPTIO_GITLAB_BOT_USERNAME: {{ dig "username" "" $bot | toString | quote }}
  {{- end }}
  {{- if or $bot.enabled (hasKey $previous "OPTIO_GITLAB_BOT_RATE_LIMIT") }}
  OPTIO_GITLAB_BOT_RATE_LIMIT: {{ dig "rateLimit" 5 $bot | toString | quote }}
  {{- end }}
  {{- /* @-mentions in GitHub comments: rendered only when turned on. */}}
  {{- $ghBot := (.Values.github).bot | default dict }}
  {{- if eq (toString (dig "enabled" false $ghBot)) "true" }}
  OPTIO_GITHUB_BOT_ENABLED: "true"
  OPTIO_GITHUB_BOT_USERNAME: {{ dig "username" "" $ghBot | toString | quote }}
  OPTIO_GITHUB_BOT_RATE_LIMIT: {{ dig "rateLimit" 5 $ghBot | toString | quote }}
  {{- end }}
  # Your CA bundle and environment, for every agent pod
  {{- with include "optio.caBundleConfigMap" . }}
  OPTIO_AGENT_CA_BUNDLE_CONFIGMAP: {{ . | quote }}
  OPTIO_AGENT_CA_BUNDLE_KEY: {{ $.Values.caBundle.key | quote }}
  {{- end }}
  {{- if or .Values.agent.env .Values.gitlab.hosts }}
  OPTIO_AGENT_ENV_CONFIGMAP: {{ printf "%s-agent-env" .Release.Name | quote }}
  {{- end }}
  {{- if .Values.notifications.vapid.publicKey }}
  OPTIO_VAPID_PUBLIC_KEY: {{ .Values.notifications.vapid.publicKey | quote }}
  OPTIO_VAPID_PRIVATE_KEY: {{ .Values.notifications.vapid.privateKey | quote }}
  OPTIO_VAPID_SUBJECT: {{ .Values.notifications.vapid.subject | quote }}
  {{- end }}
  {{- with .Values.notifications.apns }}
  {{- if and .keyId (not .existingSecret) }}
  OPTIO_APNS_KEY_ID: {{ .keyId | quote }}
  OPTIO_APNS_TEAM_ID: {{ .teamId | quote }}
  OPTIO_APNS_KEY: {{ .key | quote }}
  OPTIO_APNS_BUNDLE_ID: {{ .bundleId | quote }}
  OPTIO_APNS_ENVIRONMENT: {{ .environment | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.notifications.fcm }}
  {{- if and .serviceAccount (not .existingSecret) }}
  OPTIO_FCM_SERVICE_ACCOUNT: {{ .serviceAccount | quote }}
  {{- if .projectId }}
  OPTIO_FCM_PROJECT_ID: {{ .projectId | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  # Email through the deployment's SMTP relay (docs/notifications.md). Rendered
  # even when empty, so removing a value clears it.
  {{- with .Values.notifications.smtp }}
  {{- if not (hasKey $external "OPTIO_SMTP_URL") }}
  {{- if or .url (hasKey $previous "OPTIO_SMTP_URL") }}
  OPTIO_SMTP_URL: {{ .url | default "" | quote }}
  {{- end }}
  {{- end }}
  {{- if or .from (hasKey $previous "OPTIO_SMTP_FROM") }}
  OPTIO_SMTP_FROM: {{ .from | default "" | quote }}
  {{- end }}
  {{- if or .caPem (hasKey $previous "OPTIO_SMTP_CA_PEM") }}
  OPTIO_SMTP_CA_PEM: {{ .caPem | default "" | quote }}
  {{- end }}
  {{- if or .insecureSkipVerify (hasKey $previous "OPTIO_SMTP_INSECURE_SKIP_VERIFY") }}
  OPTIO_SMTP_INSECURE_SKIP_VERIFY: {{ ternary "true" "false" (eq (toString .insecureSkipVerify) "true") | quote }}
  {{- end }}
  {{- end }}
  # Notification delivery: retries with backoff, and how long undelivered ones are kept (docs/notifications.md)
  {{- $delivery := .Values.notifications.delivery | default dict }}
  {{- if or (ne (int $delivery.attempts) 10) (hasKey $previous "OPTIO_NOTIFY_RETRY_ATTEMPTS") }}
  OPTIO_NOTIFY_RETRY_ATTEMPTS: {{ dig "attempts" 10 $delivery | toString | quote }}
  {{- end }}
  {{- if or (ne (int $delivery.baseSeconds) 30) (hasKey $previous "OPTIO_NOTIFY_RETRY_BASE_SECONDS") }}
  OPTIO_NOTIFY_RETRY_BASE_SECONDS: {{ dig "baseSeconds" 30 $delivery | toString | quote }}
  {{- end }}
  {{- if or (ne (int $delivery.deadLetterDays) 30) (hasKey $previous "OPTIO_NOTIFY_DEAD_LETTER_DAYS") }}
  OPTIO_NOTIFY_DEAD_LETTER_DAYS: {{ dig "deadLetterDays" 30 $delivery | toString | quote }}
  {{- end }}
  # Optio agent pod configuration
  OPTIO_POD_ENABLED: {{ .Values.optio.enabled | quote }}
  # Where Ask Optio turns run: in the API pod (api-pod, the default) or in an agent pod of their own.
  OPTIO_ASSISTANT_PLACEMENT: {{ dig "assistant" "placement" "api-pod" .Values.optio | quote }}
  OPTIO_ASSISTANT_IN_POD_MAX: {{ dig "assistant" "inPodMax" 3 .Values.optio | quote }}
  # OpenTelemetry configuration
  {{- if .Values.observability.otel.enabled }}
  OPTIO_OTEL_ENABLED: "true"
  {{- if .Values.observability.otel.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otel.endpoint | quote }}
  {{- end }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.observability.otel.protocol | quote }}
  {{- if .Values.observability.otel.headers }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.observability.otel.headers | quote }}
  {{- end }}
  OTEL_SERVICE_NAME: {{ .Values.observability.otel.serviceName | quote }}
  {{- if .Values.observability.otel.resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ .Values.observability.otel.resourceAttributes | quote }}
  {{- end }}
  OPTIO_OTEL_SAMPLING_RATIO: {{ .Values.observability.otel.samplingRatio | quote }}
  OPTIO_OTEL_METRICS_INTERVAL_MS: {{ .Values.observability.otel.metricsIntervalMs | quote }}
  {{- if .Values.observability.otel.logsEnabled }}
  OPTIO_OTEL_LOGS_ENABLED: "true"
  {{- end }}
  {{- if .Values.observability.otel.debug }}
  OPTIO_OTEL_DEBUG: "true"
  {{- end }}
  {{- end }}
