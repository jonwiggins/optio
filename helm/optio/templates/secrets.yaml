{{- if and .Values.postgresql.enabled (not .Values.auth.disabled) (not .Values.postgresql.auth.password) }}
  {{- fail "postgresql.auth.password is required when auth is enabled. Set a strong password for production use." }}
{{- end }}
{{- include "optio.validateRequired" . }}
{{- include "optio.validateEncryptionKey" . }}
{{- $external := .Values.existingSecrets | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "optio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not (hasKey $external "DATABASE_URL") }}
  DATABASE_URL: {{ include "optio.databaseUrl" . | quote }}
  {{- end }}
  {{- if not (hasKey $external "REDIS_URL") }}
  REDIS_URL: {{ include "optio.redisUrl" . | quote }}
  {{- end }}
  {{- if and .Values.redis.enabled .Values.redis.tls.enabled }}
  REDIS_CA_CERT_PATH: "/etc/redis-tls/ca.crt"
  {{- end }}
  {{- /* Built-in Redis is one server; the mode only applies to externalRedis.
         (`default`s: an upgrade with --reuse-values keeps older values.) */ -}}
  {{- $redisMode := ternary "standalone" (.Values.externalRedis.mode | default "standalone") .Values.redis.enabled }}
  REDIS_MODE: {{ $redisMode | quote }}
  {{- with .Values.externalRedis.queuePrefix }}
  OPTIO_QUEUE_PREFIX: {{ . | quote }}
  {{- else }}
  # An explicit empty value: a key dropped from stringData lingers in the
  # Secret's data, which would keep a once-set prefix on.
  OPTIO_QUEUE_PREFIX: ""
  {{- end }}
  {{- if not (hasKey $external "OPTIO_ENCRYPTION_KEY") }}
  OPTIO_ENCRYPTION_KEY: {{ required "encryption.key is required" .Values.encryption.key | quote }}
  {{- end }}
  OPTIO_AGENT_IMAGE: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
  OPTIO_AGENT_IMAGE_PREFIX: {{ .Values.agent.image.prefix | quote }}
  OPTIO_AGENT_IMAGE_TAG: {{ .Values.agent.image.tag | quote }}
  OPTIO_IMAGE_PULL_POLICY: {{ .Values.agent.imagePullPolicy | quote }}
  OPTIO_RUNTIME: "kubernetes"
  OPTIO_AUTH_DISABLED: {{ .Values.auth.disabled | quote }}
  {{- $previous := (lookup "v1" "Secret" .Values.namespace (printf "%s-config" .Release.Name)).data | default dict }}
  {{- $settings := include "optio.featureSettings" . | fromYaml | default dict }}
  {{- range $env := list "OPTIO_RUNTIMES" "OPTIO_GIT_PLATFORMS" "OPTIO_TRIGGERS" "OPTIO_TICKET_SOURCES" "OPTIO_CONNECTION_PROVIDERS" }}
  {{- if or (hasKey $settings $env) (hasKey $previous $env) }}
  {{ $env }}: {{ index $settings $env | default "" | quote }}
  {{- end }}
  {{- end }}
  {{- $creation := (.Values.workspaces | default dict).creation | default "everyone" }}
  {{- if not (has $creation (list "everyone" "admins")) }}
  {{- fail "workspaces.creation must be everyone or admins" }}
  {{- end }}
  {{- if or (ne $creation "everyone") (hasKey $previous "OPTIO_WORKSPACE_CREATION") }}
  OPTIO_WORKSPACE_CREATION: {{ $creation | quote }}
  {{- end }}
  {{- $onboarding := (.Values.onboarding | default dict).enabled | default false }}
  {{- if or $onboarding (hasKey $previous "OPTIO_ONBOARDING") }}
  OPTIO_ONBOARDING: {{ $onboarding | toString | quote }}
  {{- end }}
  {{- if .Values.publicUrl }}
  PUBLIC_URL: {{ .Values.publicUrl | quote }}
  {{- end }}
  {{- /* Only an explicit value: the web's NodePort fallback (localhost) must
         never become the API's OAuth callback origin. */}}
  {{- if .Values.web.publicApiUrl }}
  PUBLIC_API_URL: {{ .Values.web.publicApiUrl | quote }}
  {{- end }}
  {{- /* Explicit empty values clear a previously configured commit identity. */}}
  {{- $git := .Values.agent.git | default dict }}
  GIT_BOT_NAME: {{ $git.botName | default "" | quote }}
  GIT_BOT_EMAIL: {{ $git.botEmail | default "" | quote }}
  {{- if .Values.auth.setupToken }}
  {{- if not (hasKey $external "OPTIO_SETUP_TOKEN") }}
  OPTIO_SETUP_TOKEN: {{ .Values.auth.setupToken | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.auth.deploymentAdmins }}
  OPTIO_DEPLOYMENT_ADMINS: {{ join "," .Values.auth.deploymentAdmins | quote }}
  {{- end }}
  {{- if .Values.configAsCode.enabled }}
  # Config as code: the mounted manifest directory (docs/config-as-code.md).
  # (`default`s: an upgrade with --reuse-values doesn't pick up new chart defaults.)
  OPTIO_CONFIG_DIR: {{ .Values.configAsCode.mountPath | default "/etc/optio-config" | quote }}
  {{- if .Values.configAsCode.workspace }}
  OPTIO_CONFIG_WORKSPACE: {{ .Values.configAsCode.workspace | quote }}
  {{- end }}
  OPTIO_CONFIG_PRUNE: {{ .Values.configAsCode.prune | quote }}
  OPTIO_CONFIG_INTERVAL: {{ .Values.configAsCode.intervalMs | default 60000 | quote }}
  {{- else }}
  # Off. An explicit empty value: a key dropped from stringData lingers in the
  # Secret's data, which would keep a once-enabled directory on.
  OPTIO_CONFIG_DIR: ""
  {{- end }}
  {{- if .Values.auth.github.clientId }}
  {{- if not (hasKey $external "GITHUB_OAUTH_CLIENT_ID") }}
  GITHUB_OAUTH_CLIENT_ID: {{ .Values.auth.github.clientId | quote }}
  {{- end }}
  {{- if not (hasKey $external "GITHUB_OAUTH_CLIENT_SECRET") }}
  GITHUB_OAUTH_CLIENT_SECRET: {{ .Values.auth.github.clientSecret | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.auth.google.clientId }}
  {{- if not (hasKey $external "GOOGLE_OAUTH_CLIENT_ID") }}
  GOOGLE_OAUTH_CLIENT_ID: {{ .Values.auth.google.clientId | quote }}
  {{- end }}
  {{- if not (hasKey $external "GOOGLE_OAUTH_CLIENT_SECRET") }}
  GOOGLE_OAUTH_CLIENT_SECRET: {{ .Values.auth.google.clientSecret | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.auth.gitlab.clientId }}
  {{- if not (hasKey $external "GITLAB_OAUTH_CLIENT_ID") }}
  GITLAB_OAUTH_CLIENT_ID: {{ .Values.auth.gitlab.clientId | quote }}
  {{- end }}
  {{- if not (hasKey $external "GITLAB_OAUTH_CLIENT_SECRET") }}
  GITLAB_OAUTH_CLIENT_SECRET: {{ .Values.auth.gitlab.clientSecret | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.auth.linkAccountsByEmail (not (hasKey $external "OPTIO_LINK_ACCOUNTS_BY_EMAIL")) }}
  OPTIO_LINK_ACCOUNTS_BY_EMAIL: "true"
  {{- end }}
  {{- $oidc := .Values.auth.oidc | default dict }}
  {{- if $oidc.issuerUrl }}
  {{- if not (hasKey $external "OIDC_ISSUER_URL") }}
  OIDC_ISSUER_URL: {{ $oidc.issuerUrl | quote }}
  {{- end }}
  {{- if not (hasKey $external "OIDC_CLIENT_ID") }}
  OIDC_CLIENT_ID: {{ $oidc.clientId | quote }}
  {{- end }}
  {{- if not (hasKey $external "OIDC_CLIENT_SECRET") }}
  OIDC_CLIENT_SECRET: {{ $oidc.clientSecret | quote }}
  {{- end }}
  {{- if $oidc.displayName }}
  {{- if not (hasKey $external "OIDC_DISPLAY_NAME") }}
  OIDC_DISPLAY_NAME: {{ $oidc.displayName | quote }}
  {{- end }}
  {{- end }}
  {{- if $oidc.scopes }}
  {{- if not (hasKey $external "OIDC_SCOPES") }}
  OIDC_SCOPES: {{ $oidc.scopes | quote }}
  {{- end }}
  {{- end }}
  {{- if $oidc.groupsClaim }}
  OIDC_GROUPS_CLAIM: {{ $oidc.groupsClaim | quote }}
  {{- end }}
  {{- /* Only an explicit true turns these on (unset = the API's default, false). */}}
  {{- /* Explicit empty values clear a previously configured group list. */}}
  OIDC_ADMIN_GROUPS: {{ join "," ($oidc.adminGroups | default list) | quote }}
  OIDC_REQUIRED_GROUPS: {{ join "," ($oidc.requiredGroups | default list) | quote }}
  OIDC_AUTO_JOIN_ORGANIZATION: {{ ternary "true" "false" (eq (toString $oidc.autoJoinOrganization) "true") | quote }}
  OIDC_TRUST_EMAIL: {{ ternary "true" "false" (eq (toString $oidc.trustEmail) "true") | quote }}
  OIDC_USE_PKCE: {{ ternary "true" "false" (eq (toString $oidc.usePkce) "true") | quote }}
  OIDC_LINK_BY_EMAIL: {{ ternary "true" "false" (eq (toString $oidc.linkByEmail) "true") | quote }}
  {{- if $oidc.caPem }}
  OIDC_CA_PEM: {{ $oidc.caPem | quote }}
  {{- end }}
  {{- end }}
  {{- $ldap := .Values.auth.ldap | default dict }}
  {{- if $ldap.url }}
  LDAP_URL: {{ $ldap.url | quote }}
  LDAP_START_TLS: {{ ternary "true" "false" (eq (toString $ldap.startTls) "true") | quote }}
  {{- if $ldap.bindDn }}
  LDAP_BIND_DN: {{ $ldap.bindDn | quote }}
  {{- if not (hasKey $external "LDAP_BIND_PASSWORD") }}
  LDAP_BIND_PASSWORD: {{ $ldap.bindPassword | quote }}
  {{- end }}
  {{- end }}
  LDAP_USER_BASE_DN: {{ required "auth.ldap.userBaseDn is required with auth.ldap.url (where users live, e.g. OU=People,DC=example,DC=com)" $ldap.userBaseDn | quote }}
  {{- with $ldap.userFilter }}
  LDAP_USER_FILTER: {{ . | quote }}
  {{- end }}
  {{- with $ldap.usernameAttribute }}
  LDAP_USERNAME_ATTRIBUTE: {{ . | quote }}
  {{- end }}
  {{- with $ldap.emailAttribute }}
  LDAP_EMAIL_ATTRIBUTE: {{ . | quote }}
  {{- end }}
  {{- with $ldap.displayNameAttribute }}
  LDAP_DISPLAY_NAME_ATTRIBUTE: {{ . | quote }}
  {{- end }}
  {{- with $ldap.groupMode }}
  LDAP_GROUP_MODE: {{ . | quote }}
  {{- end }}
  {{- with $ldap.groupBaseDn }}
  LDAP_GROUP_BASE_DN: {{ . | quote }}
  {{- end }}
  {{- with $ldap.groupFilter }}
  LDAP_GROUP_FILTER: {{ . | quote }}
  {{- end }}
  LDAP_LINK_BY_EMAIL: {{ ternary "true" "false" (eq (toString $ldap.linkByEmail) "true") | quote }}
  {{- with $ldap.displayName }}
  LDAP_DISPLAY_NAME: {{ . | quote }}
  {{- end }}
  {{- with $ldap.caPem }}
  LDAP_CA_PEM: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- /* GitHub App IDs must be quoted strings in values.yaml to avoid YAML float truncation */ -}}
  {{- if and .Values.github.app.id (not .Values.github.app.existingSecret) }}
  GITHUB_APP_ID: {{ .Values.github.app.id | toString | quote }}
  GITHUB_APP_CLIENT_ID: {{ .Values.github.app.clientId | toString | quote }}
  GITHUB_APP_CLIENT_SECRET: {{ .Values.github.app.clientSecret | toString | quote }}
  GITHUB_APP_INSTALLATION_ID: {{ .Values.github.app.installationId | toString | quote }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.github.app.privateKey | toString | quote }}
  {{- if .Values.github.app.botName }}
  GITHUB_APP_BOT_NAME: {{ .Values.github.app.botName | quote }}
  {{- end }}
  {{- if .Values.github.app.botEmail }}
  GITHUB_APP_BOT_EMAIL: {{ .Values.github.app.botEmail | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.webhook.githubSecret }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.webhook.githubSecret | quote }}
  {{- end }}
  {{- if .Values.webhook.slackSigningSecret }}
  SLACK_SIGNING_SECRET: {{ .Values.webhook.slackSigningSecret | quote }}
  {{- end }}
  {{- if .Values.webhook.linearSecret }}
  LINEAR_WEBHOOK_SECRET: {{ .Values.webhook.linearSecret | quote }}
  {{- end }}
  {{- if .Values.webhook.pagerdutySecret }}
  PAGERDUTY_WEBHOOK_SECRET: {{ .Values.webhook.pagerdutySecret | quote }}
  {{- end }}
  {{- if .Values.webhook.gitlabSecret }}
  GITLAB_WEBHOOK_SECRET: {{ .Values.webhook.gitlabSecret | quote }}
  {{- end }}
  {{- if .Values.webhook.jiraSecret }}
  JIRA_WEBHOOK_SECRET: {{ .Values.webhook.jiraSecret | quote }}
  {{- end }}
  {{- if .Values.webhook.sentrySecret }}
  SENTRY_WEBHOOK_SECRET: {{ .Values.webhook.sentrySecret | quote }}
  {{- end }}
  {{- if .Values.credentialSecret }}
  OPTIO_CREDENTIAL_SECRET: {{ .Values.credentialSecret | quote }}
  {{- else if not (hasKey $external "OPTIO_ENCRYPTION_KEY") }}
  OPTIO_CREDENTIAL_SECRET: {{ printf "%s:credential-secret" .Values.encryption.key | sha256sum | quote }}
  {{- end }}
  {{- with .Values.auth.gitea }}
  {{- if .baseUrl }}
  GITEA_OAUTH_BASE_URL: {{ .baseUrl | quote }}
  GITEA_OAUTH_CLIENT_ID: {{ .clientId | quote }}
  {{- if not (hasKey $external "GITEA_OAUTH_CLIENT_SECRET") }}
  GITEA_OAUTH_CLIENT_SECRET: {{ .clientSecret | quote }}
  {{- end }}
  GITEA_DISPLAY_NAME: {{ .displayName | quote }}
  GITEA_OAUTH_SCOPES: {{ .scopes | quote }}
  GITEA_CA_PEM: {{ .caPem | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.auth.bitbucket }}
  {{- if .clientId }}
  BITBUCKET_OAUTH_CLIENT_ID: {{ .clientId | quote }}
  {{- if not (hasKey $external "BITBUCKET_OAUTH_CLIENT_SECRET") }}
  BITBUCKET_OAUTH_CLIENT_SECRET: {{ .clientSecret | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  # Agent pod scheduling
  {{- if .Values.agent.nodeSelector }}
  OPTIO_AGENT_NODE_SELECTOR: {{ .Values.agent.nodeSelector | toJson | quote }}
  {{- end }}
  {{- if .Values.agent.tolerations }}
  OPTIO_AGENT_TOLERATIONS: {{ .Values.agent.tolerations | toJson | quote }}
  {{- end }}
  # Cache directory PVC configuration
  OPTIO_CACHE_STORAGE_CLASS: {{ .Values.agent.cache.storageClass | quote }}
  OPTIO_CACHE_MAX_SIZE_PER_DIR_GI: {{ .Values.agent.cache.maxSizePerDirectoryGi | quote }}
  OPTIO_CACHE_MAX_SIZE_TOTAL_GI: {{ .Values.agent.cache.maxSizeTotalGi | quote }}
  # Repo init timeout
  OPTIO_REPO_INIT_TIMEOUT_MS: {{ .Values.agent.repoInitTimeoutMs | quote }}
  # Per-IP API rate limit (requests / minute)
  OPTIO_RATE_LIMIT_MAX: {{ .Values.rateLimit.maxPerMinute | quote }}
  # Outbound URL guard (SSRF): private ranges and always-allowed hosts
  OPTIO_OUTBOUND_ALLOW_PRIVATE: {{ .Values.outbound.allowPrivate | quote }}
  OPTIO_OUTBOUND_ALLOWED_HOSTS: {{ join "," .Values.outbound.allowedHosts | quote }}
  {{- if .Values.notifications.vapid.publicKey }}
  OPTIO_VAPID_PUBLIC_KEY: {{ .Values.notifications.vapid.publicKey | quote }}
  OPTIO_VAPID_PRIVATE_KEY: {{ .Values.notifications.vapid.privateKey | quote }}
  OPTIO_VAPID_SUBJECT: {{ .Values.notifications.vapid.subject | quote }}
  {{- end }}
  {{- with .Values.notifications.apns }}
  {{- if and .keyId (not .existingSecret) }}
  OPTIO_APNS_KEY_ID: {{ .keyId | quote }}
  OPTIO_APNS_TEAM_ID: {{ .teamId | quote }}
  OPTIO_APNS_KEY: {{ .key | quote }}
  OPTIO_APNS_BUNDLE_ID: {{ .bundleId | quote }}
  OPTIO_APNS_ENVIRONMENT: {{ .environment | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.notifications.fcm }}
  {{- if and .serviceAccount (not .existingSecret) }}
  OPTIO_FCM_SERVICE_ACCOUNT: {{ .serviceAccount | quote }}
  {{- if .projectId }}
  OPTIO_FCM_PROJECT_ID: {{ .projectId | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  # Optio agent pod configuration
  OPTIO_POD_ENABLED: {{ .Values.optio.enabled | quote }}
  # Runtime repo policies and the chart policy are additive; keep their exclusions aligned.
  OPTIO_AGENT_DENIED_EGRESS_CIDRS: {{ .Values.networkPolicy.deniedEgressCidrs | default list | toJson | quote }}
  # OpenTelemetry configuration
  {{- if .Values.observability.otel.enabled }}
  OPTIO_OTEL_ENABLED: "true"
  {{- if .Values.observability.otel.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otel.endpoint | quote }}
  {{- end }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.observability.otel.protocol | quote }}
  {{- if .Values.observability.otel.headers }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.observability.otel.headers | quote }}
  {{- end }}
  OTEL_SERVICE_NAME: {{ .Values.observability.otel.serviceName | quote }}
  {{- if .Values.observability.otel.resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ .Values.observability.otel.resourceAttributes | quote }}
  {{- end }}
  OPTIO_OTEL_SAMPLING_RATIO: {{ .Values.observability.otel.samplingRatio | quote }}
  OPTIO_OTEL_METRICS_INTERVAL_MS: {{ .Values.observability.otel.metricsIntervalMs | quote }}
  {{- if .Values.observability.otel.logsEnabled }}
  OPTIO_OTEL_LOGS_ENABLED: "true"
  {{- end }}
  {{- if .Values.observability.otel.debug }}
  OPTIO_OTEL_DEBUG: "true"
  {{- end }}
  {{- end }}

  {{- $starters := eq (toString (dig "starters" false (.Values.prompts | default dict))) "true" }}
  {{- if or $starters (hasKey $previous "OPTIO_STARTER_PROMPTS") }}
  OPTIO_STARTER_PROMPTS: {{ ternary "true" "false" $starters | quote }}
  {{- end }}

  {{- $tickets := .Values.tickets | default dict }}
  {{- $trace := $tickets.traceability | default dict }}
  {{- if not (kindIs "map" $trace) }}{{ $trace = dict }}{{ end }}
  {{- $traceRepos := join "," ($trace.repos | default list) }}
  {{- if or $traceRepos (hasKey $previous "OPTIO_WORK_TRACEABILITY_REPOS") }}
  OPTIO_WORK_TRACEABILITY_REPOS: {{ $traceRepos | quote }}
  {{- end }}
  {{- /* Only an explicit true puts the requester's email in commits. */}}
  {{- $traceEmail := eq (toString (dig "requesterEmail" false $trace)) "true" }}
  {{- if or $traceEmail (hasKey $previous "OPTIO_WORK_TRACEABILITY_EMAIL") }}
  OPTIO_WORK_TRACEABILITY_EMAIL: {{ ternary "true" "false" $traceEmail | quote }}
  {{- end }}
  {{- /* Trailers: unset, the API's default (on, with traceability); rendered once set. */}}
  {{- if or (hasKey $tickets "commitTrailers") (hasKey $previous "OPTIO_COMMIT_TRAILERS") }}
  OPTIO_COMMIT_TRAILERS: {{ ternary "false" "true" (eq (toString (dig "commitTrailers" true $tickets)) "false") | quote }}
  {{- end }}
