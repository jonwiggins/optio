{{- if .Values.redis.enabled }}
{{- if .Values.redis.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-redis-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "optio.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
  {{- if .Values.redis.persistence.storageClass }}
  storageClassName: {{ .Values.redis.persistence.storageClass | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: redis
    {{- include "optio.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Separate Redis instances are not replicas: do not route clients to both.
  # With persistence on, the ReadWriteOnce volume also can't attach to the new
  # pod while the old one holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      {{- if .Values.redis.persistence.enabled }}
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Ensure the data volume is owned by uid/gid 999. Some CSI drivers
        # don't apply fsGroup to the mount at all (fsGroupPolicy: None), which
        # leaves redis unable to create its append-only dir and fails startup.
        - name: init-data-perms
          image: busybox:1.36
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # chown/chmod require these caps even when running as UID 0;
              # `drop: ALL` alone leaves root unable to change ownership.
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          command: ['sh', '-c']
          args:
            - |
              chown -R 999:999 /data
              chmod 700 /data
          volumeMounts:
            - name: redis-data
              mountPath: /data
      {{- end }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- if or .Values.redis.tls.enabled .Values.redis.auth.enabled .Values.redis.persistence.enabled }}
          args:
            - redis-server
            {{- if .Values.redis.tls.enabled }}
            - --tls-port
            - "6379"
            - --port
            - "0"
            - --tls-cert-file
            - /etc/redis-tls/tls.crt
            - --tls-key-file
            - /etc/redis-tls/tls.key
            - --tls-ca-cert-file
            - /etc/redis-tls/ca.crt
            - --tls-protocols
            - "TLSv1.3"
            - --tls-auth-clients
            - "no"
            {{- end }}
            {{- if .Values.redis.auth.enabled }}
            - --requirepass
            - $(REDIS_PASSWORD)
            {{- end }}
            {{- if .Values.redis.persistence.enabled }}
            - --dir
            - /data
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            # AOF alone: no RDB snapshots on the volume, so it holds roughly the
            # base AOF plus the rewrite in progress, not that plus dump.rdb.
            - --save
            - ""
            {{- end }}
          {{- end }}
          {{- if .Values.redis.auth.enabled }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis-auth
                  key: REDIS_PASSWORD
          {{- end }}
          ports:
            - containerPort: 6379
          {{- if or .Values.redis.tls.enabled .Values.redis.persistence.enabled }}
          volumeMounts:
            {{- if .Values.redis.tls.enabled }}
            - name: redis-tls
              mountPath: /etc/redis-tls
              readOnly: true
            {{- end }}
            {{- if .Values.redis.persistence.enabled }}
            - name: redis-data
              mountPath: /data
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      {{- if or .Values.redis.tls.enabled .Values.redis.persistence.enabled }}
      volumes:
        {{- if .Values.redis.tls.enabled }}
        - name: redis-tls
          secret:
            {{- if and .Values.redis.tls.existingSecret (not .Values.redis.tls.autoGenerateCert) }}
            secretName: {{ .Values.redis.tls.existingSecret }}
            {{- else }}
            secretName: {{ .Release.Name }}-redis-tls
            {{- end }}
        {{- end }}
        {{- if .Values.redis.persistence.enabled }}
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-redis-data
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: redis
    {{- include "optio.labels" . | nindent 4 }}
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
