{{- if .Values.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Release.Name }}-quota
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "optio.labels" . | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.resourceQuota.hard | nindent 4 }}
{{- if .Values.resourceQuota.limitRange.enabled }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ .Release.Name }}-container-defaults
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "optio.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        {{- toYaml .Values.resourceQuota.limitRange.defaultRequest | nindent 8 }}
      default:
        {{- toYaml .Values.resourceQuota.limitRange.default | nindent 8 }}
{{- end }}
{{- end }}
