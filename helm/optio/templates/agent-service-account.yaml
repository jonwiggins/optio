{{- $sa := .Values.agent.serviceAccount | default dict }}
{{- if (dig "create" true $sa) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name | default (printf "%s-agent" .Release.Name) }}
  namespace: {{ .Values.namespace }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* The agent pods the API creates use this account, so the registry
       login in imagePullSecrets reaches them too (none by default). */}}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
# Agents get no API-server RBAC or automatically mounted Kubernetes token.
# AWS workload identity can project its own audience-restricted token.
automountServiceAccountToken: false
{{- end }}
