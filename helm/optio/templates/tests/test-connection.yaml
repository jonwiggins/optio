{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "optio.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-redis-ping
      image: "{{ .Values.utilityImage.repository }}:{{ .Values.utilityImage.tag }}"
      command: ['sh', '-c']
      args:
        - |
          echo "Testing Redis connectivity..."
          {{- if not (.Values.redis.connectionTestTlsAware | default false) }}
          echo PING | nc -w 5 {{ .Release.Name }}-redis 6379 | grep -q PONG || exit 1
          {{- else if .Values.redis.tls.enabled }}
          # A TLS listener: busybox speaks no TLS, so check the port answers.
          nc -z -w 5 {{ .Release.Name }}-redis 6379 || exit 1
          {{- else }}
          # NOAUTH is Redis answering too, when requirepass is on.
          echo PING | nc -w 5 {{ .Release.Name }}-redis 6379 | grep -qE 'PONG|NOAUTH' || exit 1
          {{- end }}
          echo "Redis connectivity check passed."
{{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-postgres
  namespace: {{ .Values.namespace }}
