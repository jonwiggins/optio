name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand, for a push whose event GitHub dropped (v0.19.1, 2026-10-22).
  workflow_dispatch:

# Every job only reads the repository; nothing here needs a write token.
permissions:
  contents: read

jobs:
  # Which slow suites this change needs (scripts/changed-surfaces.mjs, shared with check:push).
  # Pull requests skip the suites they can't affect; pushes to main and manual runs run everything.
  changes:
    name: Changed surfaces
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.surfaces.outputs.android }}
      api: ${{ steps.surfaces.outputs.api }}
      web: ${{ steps.surfaces.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: surfaces
        run: node scripts/changed-surfaces.mjs ${{ github.event.pull_request.base.sha }}

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: npm audit --prefix images/openclaw --omit=dev --audit-level=low
      - run: npm audit --prefix images/pi --omit=dev --audit-level=low

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck

  swift-types:
    name: Swift Types In Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-swift-types.sh

  kotlin-types:
    name: Kotlin Types In Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-kotlin-types.sh

  android:
    name: Android (build + unit tests)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The action's default packages include the legacy `tools`, which the SDK repository no
      # longer has (sdkmanager exits 1); AGP downloads the platform it needs itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      # Android modules run `testDebugUnitTest`; :core:model and :core:network are pure JVM (`test`).
      - run: ./gradlew assembleDebug testDebugUnitTest :core:model:test :core:network:test --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: apps/android/**/build/reports/tests/
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo test
      - name: Verify push gate
        run: node --test scripts/*.test.mjs scripts/offline/*.test.mjs

  integration:
    name: Integration Test
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/test-infra.sh start
      - name: Measure API coverage across unit and integration tests
        run: pnpm --filter @optio/api test:coverage

  e2e:
    name: E2E Test (fake runtime)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/test-infra.sh start
      - run: pnpm --filter @optio/api test:e2e

  web-e2e:
    name: Web E2E (Playwright ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Each shard boots its own seeded stack, so spec files never share state across runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/test-infra.sh start
      - name: Install Playwright Chromium and Firefox
        run: cd apps/web && npx playwright install --with-deps chromium firefox
      - run: pnpm --filter @optio/web test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 7

  openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI spec
        run: pnpm --filter @optio/api openapi:dump
      - name: Lint OpenAPI spec
        run: pnpm --filter @optio/api openapi:lint
      - name: Verify spec generates valid TypeScript
        run: |
          pnpm --filter @optio/api openapi:types
          cd apps/api && npx tsc --noEmit --target es2022 --module esnext --moduleResolution bundler openapi.generated.d.ts

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/web && npx next build

  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/site && npx next build

  build-image:
    name: Build Agent Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build base image
        run: docker build -t optio-base:latest -f images/base.Dockerfile .
      - name: Build node image
        run: docker build -t optio-node:latest -f images/node.Dockerfile .
